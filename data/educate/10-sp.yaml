# Cluster SP: service providers that connect many relying parties or issuers to the ecosystem.
id: sp
code: SP
title: Service providers
group: context
order: 1
summary: For providers that run the wallet integration on behalf of others.
topics:
  - id: sp-intermediary-legal
    title: Intermediary Legal
    summary: >-
      A relying party can use an intermediary that talks to the wallet on its behalf. Under eIDAS 2.0 the intermediary
      counts as a relying party itself, and it must not store data about the content of the transaction.
    subtopics: [Legal Kit]
    links:
      - title: "Regulation (EU) 2024/1183 (eIDAS 2.0)"
        url: https://eur-lex.europa.eu/eli/reg/2024/1183/oj/eng
    related: [law-implementing-acts]
