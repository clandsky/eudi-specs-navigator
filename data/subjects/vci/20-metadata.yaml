- { id: vci.metadata, kind: object, parent: vci, title: Credential Issuer metadata, endpoint: { method: GET, path: /.well-known/openid-credential-issuer, server: issuer }, description: "Configuration the Credential Issuer publishes: endpoints, offered credentials, supported algorithms and proofs." }
- { id: vci.metadata.signed, kind: behaviour, parent: vci.metadata, title: Signed metadata (application/jwt) }
- { id: vci.metadata.typ, kind: field, parent: vci.metadata, title: typ (JOSE header), location: jwt-header, description: "Marks the signed metadata JWT as Credential Issuer metadata." }
- { id: vci.metadata.x5c, kind: field, parent: vci.metadata, title: x5c (JOSE header) = access certificate, location: jwt-header, description: "Certificate chain of the key that signs the metadata, starting with the issuer's access certificate." }
- { id: vci.metadata.sub, kind: field, parent: vci.metadata, title: sub, location: jwt-payload, description: "Credential Issuer Identifier the signed metadata is about." }
- { id: vci.metadata.iat, kind: field, parent: vci.metadata, title: iat, location: jwt-payload, description: "Time the signed metadata was issued." }
- { id: vci.metadata.credential_issuer, kind: metadata-param, parent: vci.metadata, title: credential_issuer, location: jwt-payload, description: "The Credential Issuer's identifier (URL); must match the URL the metadata was fetched for." }
- { id: vci.metadata.authorization_servers, kind: metadata-param, parent: vci.metadata, title: authorization_servers, location: jwt-payload, description: "Authorization servers the issuer trusts; absent means the issuer is its own authorization server." }
- { id: vci.metadata.credential_endpoint, kind: metadata-param, parent: vci.metadata, title: credential_endpoint, location: jwt-payload, description: "URL of the Credential Endpoint where the Wallet requests credentials." }
- { id: vci.metadata.nonce_endpoint, kind: metadata-param, parent: vci.metadata, title: nonce_endpoint, location: jwt-payload, description: "URL where the Wallet fetches a fresh c_nonce for its key proofs." }
- { id: vci.metadata.notification_endpoint, kind: metadata-param, parent: vci.metadata, title: notification_endpoint, location: jwt-payload, description: "URL where the Wallet reports what happened to an issued credential (accepted, deleted, failed)." }
- { id: vci.metadata.batch_credential_issuance, kind: metadata-param, parent: vci.metadata, title: batch_credential_issuance, location: jwt-payload, description: "Announces that several credentials can be issued in one request, one per proven key." }
- { id: vci.metadata.issuer_info, kind: metadata-param, parent: vci.metadata, title: issuer_info, location: jwt-payload, description: "Array of attestations about the issuer, such as its registration certificate or registrar data." }
- { id: vci.metadata.issuer_info.registration_cert, kind: value, parent: vci.metadata.issuer_info, title: "issuer_info element with format registration_cert", location: jwt-payload, description: "issuer_info element carrying the provider's registration certificate." }
- { id: vci.metadata.issuer_info.registrar_dataset, kind: value, parent: vci.metadata.issuer_info, title: "issuer_info element with format registrar_dataset", location: jwt-payload, description: "issuer_info element carrying the provider's registration information provided by the registrar." }
- { id: vci.metadata.preferred_client_status_period, kind: metadata-param, parent: vci.metadata, title: preferred_client_status_period, location: jwt-payload, description: "How long the issuer would like the remaining status maintenance period in Wallet Instance Attestations to be." }
- { id: vci.metadata.credential_configurations_supported, kind: metadata-param, parent: vci.metadata, title: credential_configurations_supported, location: jwt-payload, description: "The credentials the issuer can issue, keyed by credential configuration identifier." }
- { id: vci.metadata.ccs.format, kind: metadata-param, parent: vci.metadata.credential_configurations_supported, title: format, location: jwt-payload, description: "Credential format of this configuration, e.g. dc+sd-jwt or mso_mdoc." }
- { id: vci.metadata.ccs.scope, kind: metadata-param, parent: vci.metadata.credential_configurations_supported, title: scope, location: jwt-payload, description: "OAuth scope the Wallet can request to obtain this credential." }
- { id: vci.metadata.ccs.cryptographic_binding_methods_supported, kind: metadata-param, parent: vci.metadata.credential_configurations_supported, title: cryptographic_binding_methods_supported, location: jwt-payload, description: "How the credential can be bound to a holder key, e.g. jwk." }
- { id: vci.metadata.ccs.proof_types_supported, kind: metadata-param, parent: vci.metadata.credential_configurations_supported, title: proof_types_supported, location: jwt-payload, description: "Key proof types the Wallet may send for this credential (jwt, attestation) and their requirements." }
- { id: vci.metadata.ccs.key_attestations_required, kind: metadata-param, parent: vci.metadata.ccs.proof_types_supported, title: key_attestations_required, location: jwt-payload, description: "Signals that key proofs must come with a key attestation, optionally with minimum key storage and user authentication levels." }
- { id: vci.metadata.ccs.credential_reuse_policy, kind: metadata-param, parent: vci.metadata.credential_configurations_supported, title: credential_metadata.credential_reuse_policy, location: jwt-payload, description: "How often the Wallet may present one credential instance before it should use a fresh one." }
- { id: vci.as-metadata, kind: object, parent: vci, title: Authorization Server metadata, endpoint: { method: GET, path: /.well-known/oauth-authorization-server, server: as }, description: "Configuration the authorization server publishes: endpoints, grant types and supported client authentication." }
- { id: vci.as-metadata.issuer, kind: metadata-param, parent: vci.as-metadata, title: issuer, location: json, description: "The authorization server's issuer identifier (URL); must match the URL the metadata was fetched for." }
- { id: vci.as-metadata.pushed_authorization_request_endpoint, kind: metadata-param, parent: vci.as-metadata, title: pushed_authorization_request_endpoint, location: json, description: "URL where the Wallet pushes its authorization request before the browser redirect." }
- { id: vci.as-metadata.token_endpoint_auth_methods_supported, kind: metadata-param, parent: vci.as-metadata, title: token_endpoint_auth_methods_supported, location: json, description: "Client authentication methods accepted at the token endpoint, e.g. attest_jwt_client_auth." }
- { id: vci.as-metadata.client_attestation_signing_alg_values_supported, kind: metadata-param, parent: vci.as-metadata, title: client_attestation_signing_alg_values_supported, location: json, description: "Algorithms accepted for signing the client attestation (WIA)." }
- { id: vci.as-metadata.client_attestation_pop_signing_alg_values_supported, kind: metadata-param, parent: vci.as-metadata, title: client_attestation_pop_signing_alg_values_supported, location: json, description: "Algorithms accepted for signing the client attestation PoP JWT." }
- { id: vci.as-metadata.dpop_signing_alg_values_supported, kind: metadata-param, parent: vci.as-metadata, title: dpop_signing_alg_values_supported, location: json, description: "Algorithms accepted for signing DPoP proofs." }
- { id: vci.metadata.content-type, kind: field, parent: vci.metadata, title: "Content-Type: application/jwt", location: header, description: "Signals that the metadata is returned as a signed JWT rather than plain JSON." }
- { id: vci.metadata.exp, kind: field, parent: vci.metadata, title: exp, location: jwt-payload, description: "Time after which the signed metadata must no longer be used." }
- { id: vci.metadata.batch_size, kind: metadata-param, parent: vci.metadata.batch_credential_issuance, title: batch_credential_issuance.batch_size, location: jwt-payload, description: "Maximum number of key proofs, and so credentials, in one Credential Request." }
- { id: vci.metadata.issuer_info.format, kind: field, parent: vci.metadata.issuer_info, title: "issuer_info[].format", location: jwt-payload, description: "Format of the issuer_info element, e.g. registration_cert or registrar_dataset." }
- { id: vci.metadata.issuer_info.data, kind: field, parent: vci.metadata.issuer_info, title: "issuer_info[].data", location: jwt-payload, description: "Content of the issuer_info element in the format named by format." }
- { id: vci.metadata.ccs.id, kind: metadata-param, parent: vci.metadata.credential_configurations_supported, title: Credential configuration identifier (the key), location: jwt-payload, description: "Key naming one credential configuration; Credential Offers and Credential Requests refer to it." }
- { id: vci.metadata.ccs.vct, kind: metadata-param, parent: vci.metadata.credential_configurations_supported, title: vct (dc+sd-jwt), location: jwt-payload, description: "Verifiable Credential Type of the SD-JWT VC issued under this configuration." }
- { id: vci.metadata.ccs.credential_signing_alg_values_supported, kind: metadata-param, parent: vci.metadata.credential_configurations_supported, title: credential_signing_alg_values_supported, location: jwt-payload, description: "Algorithms the issuer signs this credential with." }
- { id: vci.metadata.ccs.proof_type, kind: metadata-param, parent: vci.metadata.ccs.proof_types_supported, title: "Proof type identifier (jwt, attestation)", location: jwt-payload, description: "Name of a proof type: jwt (key proof JWT) or attestation (key attestation alone)." }
- { id: vci.metadata.ccs.proof_signing_alg_values_supported, kind: metadata-param, parent: vci.metadata.ccs.proof_types_supported, title: proof_signing_alg_values_supported, location: jwt-payload, description: "Algorithms the issuer accepts for signing key proofs of this type." }
- { id: vci.metadata.ccs.key_attestations_required.values, kind: metadata-param, parent: vci.metadata.ccs.key_attestations_required, title: key_storage / user_authentication accepted, location: jwt-payload, description: "Accepted levels of key storage and user authentication that the key attestation must state." }
- { id: vci.metadata.ccs.credential_metadata, kind: metadata-param, parent: vci.metadata.credential_configurations_supported, title: credential_metadata, location: jwt-payload, description: "Display and claim information about the credential, plus EUDI extensions such as the reuse policy." }
- { id: vci.metadata.ccs.reuse.id, kind: metadata-param, parent: vci.metadata.ccs.credential_reuse_policy, title: credential_reuse_policy.id, location: jwt-payload, description: "Identifies which reuse policy scheme applies, e.g. arf_annex_ii." }
- { id: vci.metadata.ccs.reuse.options, kind: metadata-param, parent: vci.metadata.ccs.credential_reuse_policy, title: credential_reuse_policy.options, location: jwt-payload, description: "Details of the reuse policy: once-only or limited-time use, batch size and reissue trigger." }
- { id: vci.metadata.ccs.reuse.details, kind: metadata-param, parent: vci.metadata.ccs.reuse.options, title: "options[].details", location: jwt-payload, description: "Kind of reuse limit: once_only or limited_time." }
- { id: vci.metadata.ccs.reuse.batch_size, kind: metadata-param, parent: vci.metadata.ccs.reuse.options, title: "options[].batch_size", location: jwt-payload, description: "Maximum number of proofs, and so credential instances, the Wallet requests in one batch." }
- { id: vci.metadata.ccs.reuse.reissue_trigger_unused, kind: metadata-param, parent: vci.metadata.ccs.reuse.options, title: "options[].reissue_trigger_unused", location: jwt-payload, description: "When the Wallet holds fewer unused instances than this, it should request new ones." }
- { id: vci.as-metadata.authorization_endpoint, kind: metadata-param, parent: vci.as-metadata, title: authorization_endpoint, location: json, description: "URL of the authorization endpoint the user's browser is sent to." }
- { id: vci.as-metadata.token_endpoint, kind: metadata-param, parent: vci.as-metadata, title: token_endpoint, location: json, description: "URL where the Wallet exchanges a code for an access token." }
- { id: vci.as-metadata.require_pushed_authorization_requests, kind: metadata-param, parent: vci.as-metadata, title: require_pushed_authorization_requests, location: json, description: "When true, the server only accepts authorization requests pushed through PAR." }
- { id: vci.as-metadata.response_types_supported, kind: metadata-param, parent: vci.as-metadata, title: response_types_supported, location: json, description: "OAuth response types the server supports; code for the authorization code flow." }
- { id: vci.as-metadata.grant_types_supported, kind: metadata-param, parent: vci.as-metadata, title: grant_types_supported, location: json, description: "Grant types accepted at the token endpoint, e.g. authorization_code or pre-authorized_code." }
- { id: vci.as-metadata.code_challenge_methods_supported, kind: metadata-param, parent: vci.as-metadata, title: code_challenge_methods_supported, location: json, description: "PKCE methods supported; S256 hashes the code verifier." }
- { id: vci.as-metadata.authorization_response_iss_parameter_supported, kind: metadata-param, parent: vci.as-metadata, title: authorization_response_iss_parameter_supported, location: json, description: "When true, the server adds iss to authorization responses so the client can detect mix-up attacks." }
- { id: vci.metadata.display, kind: metadata-param, parent: vci.metadata, title: display, location: jwt-payload, description: "Name of the Credential Issuer as the Wallet shows it, one entry per language (name, locale)." }
- { id: vci.metadata.credential_request_encryption, kind: metadata-param, parent: vci.metadata, title: credential_request_encryption, location: jwt-payload, description: "Whether and how the Wallet can encrypt the Credential Request: the issuer's encryption keys and the accepted enc values." }
- { id: vci.metadata.credential_request_encryption.jwks, kind: field, parent: vci.metadata.credential_request_encryption, title: credential_request_encryption.jwks, location: jwt-payload, description: "JWK Set (an object with a keys array) of the issuer's public keys for encrypting the Credential Request; each key has a kid." }
- { id: vci.metadata.credential_request_encryption.enc_values_supported, kind: field, parent: vci.metadata.credential_request_encryption, title: credential_request_encryption.enc_values_supported, location: jwt-payload, description: "Content encryption algorithms (enc) the Credential Endpoint accepts for encrypted requests, e.g. A128GCM." }
- { id: vci.metadata.credential_request_encryption.encryption_required, kind: field, parent: vci.metadata.credential_request_encryption, title: credential_request_encryption.encryption_required, location: jwt-payload, description: "true: every Credential Request must be encrypted; false: the Wallet chooses." }
- { id: vci.metadata.credential_response_encryption, kind: metadata-param, parent: vci.metadata, title: credential_response_encryption, location: jwt-payload, description: "Whether and how the issuer can encrypt the Credential Response to a key the Wallet sends in the request." }
- { id: vci.metadata.credential_response_encryption.alg_values_supported, kind: field, parent: vci.metadata.credential_response_encryption, title: credential_response_encryption.alg_values_supported, location: jwt-payload, description: "Key management algorithms (alg) the issuer can encrypt responses with, e.g. ECDH-ES." }
- { id: vci.metadata.credential_response_encryption.enc_values_supported, kind: field, parent: vci.metadata.credential_response_encryption, title: credential_response_encryption.enc_values_supported, location: jwt-payload, description: "Content encryption algorithms (enc) the issuer can encrypt responses with, e.g. A128GCM, A256GCM." }
- { id: vci.metadata.credential_response_encryption.encryption_required, kind: field, parent: vci.metadata.credential_response_encryption, title: credential_response_encryption.encryption_required, location: jwt-payload, description: "true: the Wallet must send a response encryption key in every Credential Request; false: the Wallet chooses." }
- { id: vci.metadata.ccs.display, kind: field, parent: vci.metadata.ccs.credential_metadata, title: credential_metadata.display, location: jwt-payload, description: "Name of the credential as the Wallet shows it, one entry per language (name, locale)." }
- { id: vci.metadata.ccs.claims, kind: field, parent: vci.metadata.ccs.credential_metadata, title: credential_metadata.claims, location: jwt-payload, description: "The credential's claims, each with its path and display names per language." }
- { id: vci.as-metadata.pre-authorized_grant_anonymous_access_supported, kind: metadata-param, parent: vci.as-metadata, title: pre-authorized_grant_anonymous_access_supported, location: json, description: "true: the token endpoint accepts a pre-authorized code without a client_id, i.e. without client authentication." }
- { id: vci.registration-cert, kind: object, parent: vci.metadata.issuer_info.registration_cert, title: Registration certificate (rc-wrp+jwt), description: "JWT from the registrar that states who the provider is and what it is registered for; carried in issuer_info." }
- { id: vci.registration-cert.entitlements, kind: field, parent: vci.registration-cert, title: entitlements, location: jwt-payload, description: "Roles the provider is registered for, as URIs, e.g. the ETSI Service_Provider entitlement." }
- { id: vci.registration-cert.provides_attestations, kind: field, parent: vci.registration-cert, title: provides_attestations, location: jwt-payload, description: "Attestations the provider is registered to issue, by format and type (vct values)." }
