- { id: vci.flow.nested-presentation, kind: flow, parent: vci, title: "Issuance: authorization code flow with a nested PID presentation, same device" }
- { id: vci.flow.refresh, kind: flow, parent: vci, title: "Credential refresh: the Wallet obtains fresh credentials with a refresh token" }
