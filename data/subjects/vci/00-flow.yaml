- { id: vci.client-auth, kind: behaviour, parent: vci, title: "Client authentication of the Wallet at the OAuth endpoints (PAR, token)" }
- { id: vci.client-auth.reject-without-wia, kind: behaviour, parent: vci.client-auth, title: Authorization server rejects PAR / token requests without a WIA }
- { id: vci.grant.authorization_code, kind: behaviour, parent: vci, title: Support of the authorization code flow }
- { id: vci.dpop, kind: behaviour, parent: vci, title: Sender-constrained access tokens (DPoP) }
- { id: vci.pkce, kind: behaviour, parent: vci, title: PKCE with S256 }
- { id: vci.par, kind: behaviour, parent: vci, title: Pushed Authorization Requests }
- { id: vci.refresh-token, kind: behaviour, parent: vci, title: Refresh tokens for credential refresh }
- { id: vci.refresh-token.rotation, kind: behaviour, parent: vci.refresh-token, title: Refresh token rotation, description: "The authorization server may answer a refresh with a new refresh token. The Wallet then keeps only the new one; the server may revoke the old one." }
- { id: vci.refresh-token.lifetime, kind: behaviour, parent: vci.refresh-token, title: How long a refresh token may refresh credentials, description: "The issuer decides how long after the original issuance a refresh token still yields new credentials. After that period the Wallet starts the issuance flow from the beginning, with the user." }
- { id: vci.credential-refresh, kind: behaviour, parent: vci, title: Credential refresh without user interaction, description: "The Wallet obtains a new access token with its refresh token and requests the credentials again at the Credential Endpoint. The user is not involved. The Wallet starts a refresh on its own, for example before the credentials expire, or after a signal from the issuer; how the issuer sends such a signal is not standardised. The issuer decides whether the new credentials carry updated claim values or only a new signature and validity." }
- { id: vci.crypto.aes-gcm, kind: behaviour, parent: vci, title: Support of A128GCM and A256GCM }
- { id: vci.preauth.physical-presence, kind: behaviour, parent: vci, title: "PID providers: user authorisation with physical presence in the pre-authorized code flow" }
