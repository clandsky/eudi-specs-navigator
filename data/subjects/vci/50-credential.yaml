- { id: vci.nonce-request, kind: message, parent: vci, title: Nonce Request, endpoint: { method: POST, path: /nonce, server: issuer } }
- { id: vci.nonce-response, kind: message, parent: vci, title: Nonce Response }
- { id: vci.nonce-response.c_nonce, kind: field, parent: vci.nonce-response, title: c_nonce, location: json, description: "Fresh nonce from the issuer that the Wallet puts into its key proofs, showing they were made just now." }
- { id: vci.nonce-response.cache-control, kind: field, parent: vci.nonce-response, title: "Cache-Control: no-store", location: header, description: "Keeps the nonce response out of any cache." }
- { id: vci.credential-request, kind: message, parent: vci, title: Credential Request, endpoint: { method: POST, path: /credential, server: issuer } }
- { id: vci.credential-request.authorization, kind: field, parent: vci.credential-request, title: "Authorization: DPoP <access token>", location: header, description: "The DPoP-bound access token from the token response." }
- { id: vci.credential-request.dpop, kind: field, parent: vci.credential-request, title: DPoP proof, location: header, description: "DPoP proof for this request, bound to the access token via ath." }
- { id: vci.credential-request.credential_configuration_id, kind: field, parent: vci.credential-request, title: credential_configuration_id, location: json, description: "Which credential configuration from the issuer metadata the Wallet requests." }
- { id: vci.credential-request.proofs, kind: field, parent: vci.credential-request, title: proofs, location: json, description: "Proofs of possession of the keys the credentials should be bound to, grouped by proof type." }
- { id: vci.credential-request.proofs.jwt, kind: field, parent: vci.credential-request.proofs, title: proofs.jwt, location: json, description: "Array of key proof JWTs, one per key to be bound." }
- { id: vci.credential-request.proofs.attestation, kind: field, parent: vci.credential-request.proofs, title: proofs.attestation, location: json, description: "Key attestation used directly as proof, covering all attested keys at once." }
- { id: vci.proof-jwt, kind: object, parent: vci, title: Key proof JWT (proof type jwt), description: "JWT signed with the key to be bound, proving the Wallet holds it and that the proof is fresh." }
- { id: vci.proof-jwt.typ, kind: field, parent: vci.proof-jwt, title: typ, location: jwt-header, description: "Marks the JWT as a key proof (openid4vci-proof+jwt)." }
- { id: vci.proof-jwt.key_attestation, kind: field, parent: vci.proof-jwt, title: key_attestation (JOSE header), location: jwt-header, description: "Key attestation from the Wallet Provider, vouching for how the proven key is stored and protected." }
- { id: vci.proof-jwt.signing-key, kind: behaviour, parent: vci.proof-jwt, title: "Proof signed with the key at attested_keys[0]" }
- { id: vci.proof-jwt.aud, kind: field, parent: vci.proof-jwt, title: aud, location: jwt-payload, description: "The Credential Issuer identifier the proof is meant for." }
- { id: vci.proof-jwt.nonce, kind: field, parent: vci.proof-jwt, title: nonce, location: jwt-payload, description: "The c_nonce from the issuer, showing the proof is fresh." }
- { id: vci.credential-response, kind: message, parent: vci, title: Credential Response }
- { id: vci.credential-response.credentials, kind: field, parent: vci.credential-response, title: credentials, location: json, description: "Array of issued credentials, one object per credential instance." }
- { id: vci.credential-response.notification_id, kind: field, parent: vci.credential-response, title: notification_id, location: json, description: "Identifier the Wallet uses to report back about these credentials at the notification endpoint." }
- { id: vci.notification-request, kind: message, parent: vci, title: Notification Request, endpoint: { method: POST, path: /notification, server: issuer } }
- { id: vci.notification-request.event, kind: field, parent: vci.notification-request, title: event, location: json, description: "What happened to the credentials: credential_accepted, credential_deleted or credential_failure." }
- { id: vci.notification-response, kind: message, parent: vci, title: Notification Response (204) }
- { id: vci.nonce-response.dpop-nonce, kind: field, parent: vci.nonce-response, title: DPoP-Nonce header, location: header, description: "Server-provided nonce the Wallet must include in its next DPoP proofs." }
- { id: vci.proof-jwt.iat, kind: field, parent: vci.proof-jwt, title: iat, location: jwt-payload, description: "Time the proof was created." }
- { id: vci.credential-response.credential, kind: field, parent: vci.credential-response.credentials, title: "credentials[].credential", location: json, description: "One issued credential, e.g. an SD-JWT VC with its Disclosures." }
- { id: vci.notification-request.notification_id, kind: field, parent: vci.notification-request, title: notification_id, location: json, description: "The notification_id from the Credential Response." }
- { id: vci.credential-request.credential_response_encryption, kind: field, parent: vci.credential-request, title: credential_response_encryption, location: json, description: "The Wallet's key and enc value for encrypting the Credential Response; absent means an unencrypted response." }
- { id: vci.credential-request.credential_response_encryption.jwk, kind: field, parent: vci.credential-request.credential_response_encryption, title: credential_response_encryption.jwk, location: json, description: "Single public key (JWK, with alg) the issuer encrypts the Credential Response to." }
- { id: vci.credential-request.credential_response_encryption.enc, kind: field, parent: vci.credential-request.credential_response_encryption, title: credential_response_encryption.enc, location: json, description: "Content encryption algorithm for the response, one of the issuer's enc_values_supported, e.g. A128GCM." }
- { id: vci.credential-encryption, kind: object, parent: vci, title: Encrypted Credential Request or Response (JWE), description: "Credential Request or Response sent as a compact JWE (application/jwt) on top of TLS, encrypted with ECDH-ES." }
- { id: vci.credential-encryption.enc, kind: field, parent: vci.credential-encryption, title: enc (JWE header), location: jwt-header, description: "Content encryption algorithm of the JWE, e.g. A128GCM." }
- { id: vci.credential-encryption.kid, kind: field, parent: vci.credential-encryption, title: kid (JWE header), location: jwt-header, description: "kid of the recipient's public key the JWE was encrypted to." }
- { id: vci.credential-encryption.epk, kind: field, parent: vci.credential-encryption, title: epk (JWE header), location: jwt-header, description: "Ephemeral public key of the sender for the ECDH-ES key agreement." }
- { id: vci.credential-encryption.jwk, kind: field, parent: vci.credential-encryption, title: jwk (JWE header), location: jwt-header, description: "The recipient's public key repeated in the JWE header next to kid; neither RFC 7516 nor OpenID4VCI Section 10 asks for it." }
