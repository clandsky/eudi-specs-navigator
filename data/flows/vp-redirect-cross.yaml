id: vp-redirect-cross
title: Presentation — OpenID4VP redirect, cross device
role: verifier
subject: vp.flow.redirect-cross
variant: { transport: redirect, device: cross }
summary: >-
  The verifier's website runs on a desktop; the user scans a QR code with the wallet on the phone. There is no redirect
  back, so the browser session cannot be bound to the response (session fixation, OpenID4VP §14.2). The CIR position:
  EUDI Wallets should not support the redirects-based mechanism for cross-device flows; HAIP recommends that verifiers
  use only same-device redirects. Cross device is meant to run over the Digital Credentials API.
participants:
  - { id: verifier, label: Verifier, role: verifier }
  - { id: wallet, label: Wallet (phone), role: wallet }
steps:
