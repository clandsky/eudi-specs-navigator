id: vp-redirect-cross
title: Presentation — OpenID4VP redirect, cross device
role: verifier
subject: vp.flow.redirect-cross
variant: { transport: redirect, device: cross }
summary: >-
  The verifier's website runs on a desktop; the user scans a QR code with the wallet on the phone. There is no redirect
  back, so the browser session cannot be bound to the response (session fixation, OpenID4VP §14.2). The CIR position:
  EUDI Wallets should not support the redirects-based mechanism for cross-device flows; HAIP recommends that verifiers
  use only same-device redirects. Cross device is meant to run over the Digital Credentials API.
participants:
  - { id: browser, label: Frontend (desktop) }
  - { id: wallet, label: Wallet (phone), role: wallet }
  - { id: verifier, label: Verifier backend, role: verifier }
steps:
  - { id: qr, from: browser, to: wallet, kind: redirect, label: QR code scanned, subject: vp.cross-device-redirect, example: vp-authorization-request, tags: [CIR - wallet should not support] }
  - { id: fetch, from: wallet, to: verifier, kind: request, label: GET request_uri, subject: vp.request-uri-fetch, example: vp-request-uri-get }
  - { id: request-object, from: verifier, to: wallet, kind: response, label: signed Request Object, subject: vp.request-object, example: vp-request-uri-response, tags: [x509_hash, DCQL] }
  - { id: process, from: wallet, to: wallet, kind: internal, label: validate request, user consent, subject: vp.wallet.process-request }
  - { id: response, from: wallet, to: verifier, kind: request, label: POST response_uri (direct_post.jwt), subject: vp.response-post, example: vp-response-post, tags: [JWE] }
  - { id: ack, from: verifier, to: wallet, kind: response, label: "200 {}", subject: vp.response-ack, example: vp-response-ack-cross, tags: [no redirect_uri] }
  - { id: poll, from: browser, to: verifier, kind: request, label: poll for the result, subject: vp.result-poll, note: Application-specific; OpenID4VP §13.3 describes periodic querying when no redirect_uri is returned. }
