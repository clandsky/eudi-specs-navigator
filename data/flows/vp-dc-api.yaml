id: vp-dc-api
title: Presentation — OpenID4VP over the Digital Credentials API
role: verifier
subject: vp.flow.dc-api
variant: { transport: dc-api }
summary: >-
  The verifier's page calls navigator.credentials.get() with a signed OpenID4VP request (openid4vp-v1-signed). The
  browser and operating system invoke the wallet, on the same device or across devices via CTAP hybrid with a
  proximity check. The wallet checks the Origin against expected_origins and returns an encrypted response
  (dc_api.jwt) to the page; the Key Binding JWT is bound to origin:<Origin>, not to the client_id. Under the CIR both
  wallets and relying parties shall support this mechanism.
participants:
  - { id: verifier, label: Verifier, role: verifier }
  - { id: browser, label: Browser / OS }
  - { id: wallet, label: Wallet Unit, role: wallet }
steps:
  - { id: get, from: verifier, to: browser, kind: request, label: navigator.credentials.get(), subject: vp.dc-api.request, example: vp-dcapi-request, tags: [openid4vp-v1-signed, expected_origins] }
  - { id: invoke, from: browser, to: wallet, kind: internal, label: invoke wallet (local or CTAP hybrid), subject: vp.dc-api.proximity, note: "Cross device: CTAP hybrid with a proximity check (CIR OIDFVP-HAIP-ADD-API-05)." }
  - { id: process, from: wallet, to: wallet, kind: internal, label: "validate request, Origin, consent", subject: vp.wallet.process-request, note: "Origin against expected_origins (OpenID4VP A.2), signature and x509_hash, registration certificate, over-asking check, user consent." }
  - { id: answer, from: wallet, to: browser, kind: response, label: encrypted response (dc_api.jwt), subject: vp.dc-api.response, example: vp-dcapi-response, tags: ["aud = origin:", SD-JWT VC + KB-JWT] }
  - { id: forward, from: browser, to: verifier, kind: request, label: page forwards the response, subject: vp.dc-api.forward, note: Application-specific; not defined by OpenID4VP. }
