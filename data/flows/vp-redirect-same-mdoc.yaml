id: vp-redirect-same-mdoc
title: Presentation — OpenID4VP redirect, same device, ISO mdoc
role: verifier
order: 4
subject: vp.flow.redirect-same-mdoc
variant: { transport: redirect, device: same, format: mdoc }
summary: >-
  The same-device redirect flow, asking for the PID in ISO mdoc format (mso_mdoc, OpenID4VP Appendix B.2) instead of
  SD-JWT VC. The DCQL query names the doctype and addresses data elements as [namespace, element]. The vp_token
  carries a base64url CBOR DeviceResponse: issuer-signed data elements whose digests are signed in the Mobile Security
  Object, and a device signature over the SessionTranscript. There is no Key Binding JWT; the SessionTranscript binds
  the presentation to client_id, nonce, response_uri and the response encryption key (OpenID4VPHandover), so the
  Verifier rebuilds it from its own request. Under the CIR (Annex XII OIDFVP-HAIP-GEN-04) relying parties and wallets
  follow the HAIP ISO mdoc profile for this format.
participants:
  - { id: verifier, label: Verifier, role: verifier }
  - { id: wallet, label: Wallet Unit, role: wallet }
steps:
