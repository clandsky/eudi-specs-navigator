id: vci-auth-code-par
title: Issuance — authorization code flow with PAR
role: issuer
order: 1
subject: vci.flow.auth-code-par
variant: { grant: authorization_code, device: same }
summary: >-
  Issuer-initiated issuance on one device. The Wallet authenticates with its Wallet Instance Attestation at the PAR and
  token endpoints, binds the access token with DPoP, fetches a nonce, obtains a key attestation bound to that nonce
  from its Wallet Provider, and proves key possession with a jwt proof that carries the key attestation.
participants:
  - { id: wp, label: Wallet Provider, role: wallet-provider }
  - { id: wallet, label: Wallet Unit, role: wallet }
  - { id: as, label: Authorization Server, role: as }
  - { id: issuer, label: Credential Issuer, role: issuer }
steps:
  - id: provision
    from: wp
    to: wallet
    kind: internal
    label: Wallet Instance Attestation
    subject: vci.provisioning
    example: vci-wia
    tags: [WIA]
    note: Before issuance; the Wallet Provider keeps the wallet supplied with WIAs (CIR TR-WIA-2.2).
  - { id: offer, from: issuer, to: wallet, kind: redirect, label: Credential Offer, subject: vci.offer, example: vci-offer, tags: ["eu-eaa-offer://"] }
  - { id: metadata, from: wallet, to: issuer, kind: request, label: GET /.well-known/openid-credential-issuer, subject: vci.metadata, example: vci-issuer-metadata, tags: [signed] }
  - { id: as-metadata, from: wallet, to: as, kind: request, label: GET /.well-known/oauth-authorization-server, subject: vci.as-metadata, example: vci-as-metadata }
  - { id: par, from: wallet, to: as, kind: request, label: POST /par, subject: vci.par-request, example: vci-par-request, tags: [WIA + PoP, PKCE] }
  - { id: par-response, from: as, to: wallet, kind: response, label: "201 request_uri", subject: vci.par-response, example: vci-par-response }
  - { id: authorize, from: wallet, to: as, kind: redirect, label: GET /authorize (via browser), subject: vci.authorization-request, example: vci-authorization-request, tags: [client_id, request_uri] }
  - { id: user-auth, from: as, to: as, kind: internal, label: "authenticate user, consent", subject: vci.user-authentication, note: Front channel through the user agent (OpenID4VCI §3.4). }
  - { id: authz-response, from: as, to: wallet, kind: redirect, label: "302 code, iss", subject: vci.authorization-response, example: vci-authorization-response }
  - { id: token, from: wallet, to: as, kind: request, label: POST /token, subject: vci.token-request, example: vci-token-request, tags: [WIA + PoP, DPoP] }
  - { id: token-response, from: as, to: wallet, kind: response, label: DPoP access token, subject: vci.token-response, example: vci-token-response }
  - { id: nonce, from: wallet, to: issuer, kind: request, label: POST /nonce, subject: vci.nonce-request, example: vci-nonce-request }
  - { id: nonce-response, from: issuer, to: wallet, kind: response, label: c_nonce, subject: vci.nonce-response, example: vci-nonce-response, tags: [DPoP-Nonce] }
  - { id: ka-request, from: wallet, to: wp, kind: request, label: request key attestation (c_nonce), subject: vci.ka-request, note: Wallet-to-Wallet-Provider interface; not standardised by OpenID4VCI. }
  - { id: ka, from: wp, to: wallet, kind: response, label: key attestation, subject: vci.ka-request, example: vci-key-attestation, tags: [nonce, attested_keys] }
  - { id: credential, from: wallet, to: issuer, kind: request, label: POST /credential, subject: vci.credential-request, example: vci-credential-request, tags: [DPoP + nonce, proofs.jwt + KA] }
  - { id: credential-response, from: issuer, to: wallet, kind: response, label: credentials, subject: vci.credential-response, example: vci-credential-response }
  - { id: notification, from: wallet, to: issuer, kind: request, label: POST /notification, subject: vci.notification-request, example: vci-notification-request, tags: [DPoP] }
  - { id: notification-response, from: issuer, to: wallet, kind: response, label: "204", subject: vci.notification-response }
