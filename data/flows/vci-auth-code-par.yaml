id: vci-auth-code-par
title: Issuance — authorization code flow with PAR
role: issuer
order: 1
subject: vci.flow.auth-code-par
variant: { grant: authorization_code, device: same }
summary: >-
  Issuer-initiated issuance on one device. The Wallet authenticates with its Wallet Instance Attestation at the PAR and
  token endpoints, binds the access token with DPoP, fetches a nonce, obtains a key attestation bound to that nonce
  from its Wallet Provider, and proves key possession with a jwt proof that carries the key attestation. With d-you in
  the lens the steps show the messages recorded from a d-you issuance (IDGo 81, 2026-10-22): offer by QR code, the
  authorization in the phone's browser with a login form, DPoP from the PAR on, no WIA and no key attestation,
  encrypted Credential Request and Response, no notification endpoint.
participants:
  - { id: wp, label: Wallet Provider, role: wallet-provider }
  - { id: wallet, label: Wallet Unit, role: wallet }
  - { id: as, label: Authorization Server, role: as }
  - { id: issuer, label: Credential Issuer, role: issuer }
steps:
  - id: provision
    from: wp
    to: wallet
    kind: internal
    label: Wallet Instance Attestation
    subject: vci.provisioning
    example: vci-wia
    tags: [WIA]
    note: Before issuance; the Wallet Provider keeps the wallet supplied with WIAs (CIR TR-WIA-2.2).
    golive: { note: The recorded d-you run sent no WIA in this flow. }
  - { id: offer, from: issuer, to: wallet, kind: redirect, label: Credential Offer, subject: vci.offer, example: vci-offer, tags: ["eu-eaa-offer://"], golive: { example: vci-offer-authcode-dyou, tags: ["openid-credential-offer://", by value, QR code] } }
  - { id: metadata, from: wallet, to: issuer, kind: request, label: GET /.well-known/openid-credential-issuer, subject: vci.metadata, example: vci-issuer-metadata, tags: [signed], golive: { example: vci-issuer-metadata-authcode-dyou, tags: [signed, Accept application/jwt] } }
  - { id: metadata-validate, from: wallet, to: wallet, kind: internal, label: "validate signed metadata (x5c)", subject: vci.wallet.validate-metadata }
  - { id: as-metadata, from: wallet, to: as, kind: request, label: GET /.well-known/oauth-authorization-server, subject: vci.as-metadata, example: vci-as-metadata, golive: { example: vci-as-metadata-authcode-dyou } }
  - { id: par, from: wallet, to: as, kind: request, label: POST /par, subject: vci.par-request, example: vci-par-request, tags: [WIA + PoP, PKCE], golive: { example: vci-par-request-authcode-dyou, tags: [DPoP, PKCE, no WIA] } }
  - { id: par-validate, from: as, to: as, kind: internal, label: validate PAR request, subject: vci.as.validate-par-request }
  - { id: par-validate-wia, parent: par-validate, from: as, to: as, kind: internal, label: verify WIA, subject: vci.wia.verification, golive: { tags: [not sent], note: The recorded d-you run sent no WIA in this flow. } }
  - { id: par-validate-pop, parent: par-validate, from: as, to: as, kind: internal, label: verify WIA PoP, subject: vci.wia-pop.verification, golive: { tags: [not sent], note: The recorded d-you run sent no WIA in this flow. } }
  - { id: par-validate-params, parent: par-validate, from: as, to: as, kind: internal, label: "PKCE, scope, redirect_uri", subject: vci.as.check-par-request }
  - { id: par-response, from: as, to: wallet, kind: response, label: "201 request_uri", subject: vci.par-response, example: vci-par-response, golive: { example: vci-par-response-authcode-dyou } }
  - { id: authorize, from: wallet, to: as, kind: redirect, label: GET /authorize (via browser), subject: vci.authorization-request, example: vci-authorization-request, tags: [client_id, request_uri], golive: { example: vci-authorization-request-authcode-dyou, tags: [client_id, request_uri, state] } }
  - { id: user-auth, from: as, to: as, kind: internal, label: "authenticate user, consent", subject: vci.user-authentication, note: Front channel through the user agent (OpenID4VCI §3.4)., golive: { tags: [login form], note: "In the recorded d-you run the authorization endpoint answered with a login form (user Erika); the browser posted user name and password back to /authorize, a wrong password got 401 with the form again. No separate consent page: the Wallet asks for consent before." } }
  - { id: authz-response, from: as, to: wallet, kind: redirect, label: "302 code, iss", subject: vci.authorization-response, example: vci-authorization-response, golive: { example: vci-authorization-response-authcode-dyou } }
  - { id: authz-validate, from: wallet, to: wallet, kind: internal, label: check state + iss, subject: vci.wallet.check-authorization-response }
  - { id: token, from: wallet, to: as, kind: request, label: POST /token, subject: vci.token-request, example: vci-token-request, tags: [WIA + PoP, DPoP], golive: { example: vci-token-request-authcode-dyou, tags: [DPoP, no WIA] } }
  - { id: token-validate, from: as, to: as, kind: internal, label: validate token request, subject: vci.as.validate-token-request }
  - { id: token-validate-wia, parent: token-validate, from: as, to: as, kind: internal, label: verify WIA, subject: vci.wia.verification, golive: { tags: [not sent], note: The recorded d-you run sent no WIA in this flow. } }
  - { id: token-validate-pop, parent: token-validate, from: as, to: as, kind: internal, label: verify WIA PoP, subject: vci.wia-pop.verification, golive: { tags: [not sent], note: The recorded d-you run sent no WIA in this flow. } }
  - { id: token-validate-dpop, parent: token-validate, from: as, to: as, kind: internal, label: verify DPoP proof, subject: vci.dpop-proof.verification }
  - { id: token-validate-code, parent: token-validate, from: as, to: as, kind: internal, label: code + code_verifier (PKCE), subject: vci.as.check-authorization-code }
  - { id: token-response, from: as, to: wallet, kind: response, label: DPoP access token, subject: vci.token-response, example: vci-token-response, golive: { example: vci-token-response-authcode-dyou } }
  - { id: nonce, from: wallet, to: issuer, kind: request, label: POST /nonce, subject: vci.nonce-request, example: vci-nonce-request, golive: { example: vci-nonce-request-authcode-dyou } }
  - { id: nonce-response, from: issuer, to: wallet, kind: response, label: c_nonce, subject: vci.nonce-response, example: vci-nonce-response, tags: [DPoP-Nonce], golive: { example: vci-nonce-response-authcode-dyou, tags: [] } }
  - { id: ka-request, from: wallet, to: wp, kind: request, label: request key attestation (c_nonce), subject: vci.ka-request, note: Wallet-to-Wallet-Provider interface; not standardised by OpenID4VCI., golive: { tags: [not performed], note: Wallet-to-Wallet-Provider interface; not standardised by OpenID4VCI. Not performed in the recorded d-you run. } }
  - { id: ka, from: wp, to: wallet, kind: response, label: key attestation, subject: vci.ka-request, example: vci-key-attestation, tags: [nonce, attested_keys], golive: { tags: [not sent] } }
  - { id: credential, from: wallet, to: issuer, kind: request, label: POST /credential, subject: vci.credential-request, example: vci-credential-request, tags: [DPoP + nonce, proofs.jwt + KA], golive: { example: vci-credential-request-authcode-dyou, tags: [JWE, DPoP, proofs.jwt] } }
  - { id: credential-validate, from: issuer, to: issuer, kind: internal, label: validate credential request, subject: vci.issuer.validate-credential-request }
  - { id: credential-validate-token, parent: credential-validate, from: issuer, to: issuer, kind: internal, label: "access token + DPoP (ath, jkt)", subject: vci.issuer.check-access-token }
  - { id: credential-validate-config, parent: credential-validate, from: issuer, to: issuer, kind: internal, label: credential configuration + proofs, subject: vci.issuer.check-credential-configuration }
  - { id: credential-validate-ka, parent: credential-validate, from: issuer, to: issuer, kind: internal, label: verify key attestation, subject: vci.ka.verification, golive: { tags: [not sent], note: The recorded d-you run sent no key attestation. } }
  - { id: credential-validate-proof, parent: credential-validate, from: issuer, to: issuer, kind: internal, label: "verify key proof (nonce, aud)", subject: vci.proof-jwt.verification }
  - { id: issue, from: issuer, to: issuer, kind: internal, label: create and sign credentials, subject: vci.issuer.issue-credentials }
  - { id: issue-per-key, parent: issue, from: issuer, to: issuer, kind: internal, label: one credential per attested key, subject: vci.credential-response.one-per-key }
  - { id: issue-sign, parent: issue, from: issuer, to: issuer, kind: internal, label: sign SD-JWT VC (x5c), subject: vci.issuer.sign-credential }
  - { id: credential-response, from: issuer, to: wallet, kind: response, label: credentials, subject: vci.credential-response, example: vci-credential-response, golive: { example: vci-credential-response-authcode-dyou, tags: [JWE] } }
  - { id: notification, from: wallet, to: issuer, kind: request, label: POST /notification, subject: vci.notification-request, example: vci-notification-request, tags: [DPoP], golive: { tags: [not offered], note: The recorded d-you issuer offered no notification endpoint. } }
  - { id: notification-response, from: issuer, to: wallet, kind: response, label: "204", subject: vci.notification-response }
