id: vp-response-post
title: Encrypted Authorization Response (direct_post.jwt) with an SD-JWT VC presentation
note: Shape follows the d-you verifier (2026-10-16) - German PID (urn:eudi:pid:de:1), A128GCM. The real PID header also carries a kid (issuerSerial), not modelled here.
subject: vp.response-post
kind: http-request
http:
  method: POST
  url: https://verifier.example.eu/response
  headers: { Content-Type: application/x-www-form-urlencoded }
  body: { type: form, value: { response: "{{jwe:resp}}" } }
jwts:
  resp:
    encrypt: { key: verifier-enc, alg: ECDH-ES, enc: A128GCM }
    header: { kid: enc-1 }
    payload:
      vp_token: { pid-sd-jwt: ["{{sdjwt:pid}}"] }
      state: eyJhb...6-sV
  pid:
    key: pid-issuer
    header: { typ: dc+sd-jwt, alg: ES256, x5c: "{{x5c:pid-issuer}}" }
    payload: { iss: https://pid-provider.example.de, vct: "urn:eudi:pid:de:1", iat: 1791936000, exp: 1793145600, cnf: { jwk: "{{jwk:wallet-key-1}}" }, status: { status_list: { idx: 107, uri: "https://pid-provider.example.de/status/abc3d468-799f-4fbc-85df-99e7f7192da0" } } }
    disclosures:
      - { salt: n7WCBgE874lgmQW-_tIwdw, name: given_name, value: ERIKA }
      - { salt: Xp_v9sAX6VMkTy7zSA3L9A, name: family_name, value: MUSTERMANN }
    kb:
      key: wallet-key-1
      payload: { aud: "{{x509hash:verifier-access}}", nonce: n-0S6_WzA2Mj, iat: 1792072814 }
annotations:
  /http/body/response: vp.response-post.response
  /jwt/resp/header/alg: vp.authorization-response.encryption
  /jwt/resp/header/enc: vp.authorization-response.enc
  /jwt/resp/header/kid: vp.authorization-response.kid
  /jwt/resp/header/epk: vp.authorization-response.encryption
  /jwt/resp/header/epk/*: vp.authorization-response.encryption
  /jwt/resp/payload/vp_token: vp.vp_token
  /jwt/resp/payload/vp_token/*: vp.dcql.id
  /jwt/resp/payload/state: vp.request-object.state
  /jwt/pid/header/typ: sdjwtvc.typ
  /jwt/pid/payload/iss: sdjwtvc.iss
  /jwt/pid/payload/exp: sdjwtvc.exp
  /jwt/pid/payload/cnf: sdjwtvc.cnf
  /jwt/pid-kb/header/typ: vp.kb-jwt.typ
  /jwt/pid-kb/payload/sd_hash: vp.kb-jwt.sd_hash
  /jwt/pid-kb/payload/aud: vp.kb-jwt.aud
  /jwt/pid-kb/payload/nonce: vp.kb-jwt.nonce
