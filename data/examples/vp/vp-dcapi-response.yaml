id: vp-dcapi-response
title: Digital Credentials API response (dc_api.jwt)
subject: vp.dc-api.response
kind: json
json:
  protocol: openid4vp-v1-signed
  data: { response: "{{jwe:resp}}" }
jwts:
  resp:
    encrypt: { key: verifier-enc, alg: ECDH-ES, enc: A256GCM }
    header: { kid: enc-1 }
    payload:
      vp_token: { pid: ["{{sdjwt:pid}}"] }
  pid:
    key: pid-issuer
    header: { typ: dc+sd-jwt, alg: ES256, x5c: "{{x5c:pid-issuer}}" }
    payload: { iss: https://pid-provider.example.eu, vct: "urn:eudi:pid:1", iat: 1792000000, exp: 1823536000, cnf: { jwk: "{{jwk:wallet-key-1}}" }, status: { status_list: { idx: 2048, uri: "https://pid-provider.example.eu/status/pid/7" } } }
    disclosures:
      - { salt: 2GLC42sKQveCfGfryNRN9w, name: given_name, value: Erika }
      - { salt: eluV5Og3gSNII8EYnsxA_A, name: family_name, value: Mustermann }
      - { salt: 6Ij7tM-a5iVPGboS5tmvVA, name: birthdate, value: "1964-08-12" }
    kb:
      key: wallet-key-1
      payload: { aud: "origin:https://verifier.example.eu", nonce: n-1K9_RtZx4B, iat: 1792072860 }
annotations:
  /json/protocol: vp.dc-api.protocol
  /json/data: vp.dc-api.response.data
  /json/data/response: vp.dc-api.response.data
  /jwt/resp/header/alg: vp.authorization-response.encryption
  /jwt/resp/header/enc: vp.authorization-response.enc
  /jwt/resp/header/kid: vp.authorization-response.kid
  /jwt/resp/header/epk: vp.authorization-response.encryption
  /jwt/resp/header/epk/*: vp.authorization-response.encryption
  /jwt/resp/payload/vp_token: vp.vp_token
  /jwt/resp/payload/vp_token/*: vp.dcql.id
  /jwt/pid/header/typ: sdjwtvc.typ
  /jwt/pid/payload/iss: sdjwtvc.iss
  /jwt/pid/payload/exp: sdjwtvc.exp
  /jwt/pid/payload/cnf: sdjwtvc.cnf
  /jwt/pid-kb/header/typ: vp.kb-jwt.typ
  /jwt/pid-kb/payload/sd_hash: vp.kb-jwt.sd_hash
  /jwt/pid-kb/payload/aud: vp.kb-jwt.aud
  /jwt/pid-kb/payload/nonce: vp.kb-jwt.nonce
