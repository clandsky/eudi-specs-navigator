id: vci-credential-request-preauth
title: Encrypted Credential Request with a jwt proof and a response encryption key
subject: vci.credential-request
kind: http-request
note: >-
  Shape recorded from a d-you issuance (IDGo 81, 2026-10-22). The body is a compact JWE (ECDH-ES, A128GCM) to the
  issuer's request key; its header also repeats that key as jwk. The key proof carries no
  key_attestation and no iss; DPoP and holder keys differ. The Wallet sends a fresh response encryption key per request.
http:
  method: POST
  url: https://eaa.example.eu/openid4vci/credential
  headers:
    Content-Type: application/jwt
    Authorization: DPoP z6aa0Y2lPpXPZaWWbUVI5ld5uJCEeyRf2iBLd0iuXQE
    DPoP: "{{jwt:dpop}}"
  body: { type: jwt, value: "{{jwe:creq}}" }
jwts:
  creq:
    encrypt: { key: issuer-enc, alg: ECDH-ES, enc: A128GCM }
    header:
      jwk: { $jwk: issuer-enc, alg: ECDH-ES, kid: e2e6fde3-9c1c-445b-81fb-d6d46c256dcc, use: enc }
      kid: e2e6fde3-9c1c-445b-81fb-d6d46c256dcc
    payload:
      credential_response_encryption:
        jwk: { $jwk: wallet-enc, kid: 3ABFF099-0D8B-48F3-8F80-E431FDD1A5C0, alg: ECDH-ES, use: enc }
        enc: A128GCM
      proofs: { jwt: ["{{jwt:proof}}"] }
      credential_configuration_id: dog_tag_sd_jwt
  proof:
    key: wallet-key-1
    header: { alg: ES256, jwk: { $jwk: wallet-key-1, alg: ES256, kid: F44804AB-7778-487F-BC9E-7AA7462E6ED9, use: sig }, typ: openid4vci-proof+jwt }
    payload: { iat: 1792676865, nonce: lHsPx2DheLM172hYAbi8eMjK3lSXo3cw, aud: https://eaa.example.eu }
  dpop:
    key: wallet-dpop
    header: { alg: ES256, jwk: { $jwk: wallet-dpop, alg: ES256, kid: dpop-e13a2796c5b2f6ad, use: sig }, typ: dpop+jwt }
    payload:
      htm: POST
      htu: https://eaa.example.eu/openid4vci/credential
      iat: 1792676866
      ath: "{{s256:z6aa0Y2lPpXPZaWWbUVI5ld5uJCEeyRf2iBLd0iuXQE}}"
      jti: awgTCG5dBAqxtKSmk2zR
annotations:
  /http/headers/Authorization: vci.credential-request.authorization
  /http/headers/DPoP: vci.credential-request.dpop
  /http/headers/Content-Type: vci.credential-encryption
  /http/body: vci.credential-encryption
  /jwt/creq/header/enc: vci.credential-encryption.enc
  /jwt/creq/header/kid: vci.credential-encryption.kid
  /jwt/creq/header/epk: vci.credential-encryption.epk
  /jwt/creq/header/epk/*: vci.credential-encryption.epk
  /jwt/creq/header/jwk: vci.credential-encryption.jwk
  /jwt/creq/payload/credential_configuration_id: vci.credential-request.credential_configuration_id
  /jwt/creq/payload/proofs: vci.credential-request.proofs
  /jwt/creq/payload/proofs/jwt: vci.credential-request.proofs.jwt
  /jwt/creq/payload/credential_response_encryption: vci.credential-request.credential_response_encryption
  /jwt/creq/payload/credential_response_encryption/jwk: vci.credential-request.credential_response_encryption.jwk
  /jwt/creq/payload/credential_response_encryption/enc: vci.credential-request.credential_response_encryption.enc
