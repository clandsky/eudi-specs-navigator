id: vci-credential-request
title: Credential Request with a jwt proof carrying the key attestation
subject: vci.credential-request
kind: http-request
note: The authorization used scope and the Token Response returned no authorization_details, so OpenID4VCI §8.2 requires credential_configuration_id.
http:
  method: POST
  url: https://eaa.example.eu/credential
  headers:
    Content-Type: application/json
    Authorization: DPoP Kz~8mXK1EalYznwH-LC-1fBAo.4Ljp~zsPE_NeO.gxU
    DPoP: "{{jwt:dpop}}"
  body:
    type: json
    value:
      credential_configuration_id: gym_membership_sd_jwt
      proofs: { jwt: ["{{jwt:proof}}"] }
jwts:
  ka: { use: vci-wia/ka }
  proof:
    key: wallet-key-1
    header: { typ: openid4vci-proof+jwt, alg: ES256, key_attestation: "{{jwt:ka}}" }
    payload: { aud: https://eaa.example.eu, iat: 1792072920, nonce: wKI4LT17ac15ES9bw8ac4 }
  dpop:
    key: wallet-dpop
    header: { typ: dpop+jwt, alg: ES256, jwk: "{{jwk:wallet-dpop}}" }
    payload:
      jti: dpop-credential-0001
      htm: POST
      htu: https://eaa.example.eu/credential
      iat: 1792072920
      ath: "{{s256:Kz~8mXK1EalYznwH-LC-1fBAo.4Ljp~zsPE_NeO.gxU}}"
annotations:
  /http/headers/Authorization: vci.credential-request.authorization
  /http/headers/DPoP: vci.credential-request.dpop
  /http/body/credential_configuration_id: vci.credential-request.credential_configuration_id
  /http/body/proofs: vci.credential-request.proofs
  /http/body/proofs/jwt: vci.credential-request.proofs.jwt
  /jwt/proof/header/typ: vci.proof-jwt.typ
  /jwt/proof/header/key_attestation: vci.proof-jwt.key_attestation
  /jwt/proof/payload/aud: vci.proof-jwt.aud
  /jwt/proof/payload/nonce: vci.proof-jwt.nonce
  /jwt/ka/header/typ: vci.ka.typ
  /jwt/ka/header/x5c: vci.ka.x5c
  /jwt/ka/payload/exp: vci.ka.exp
  /jwt/ka/payload/attested_keys: vci.ka.attested_keys
  /jwt/ka/payload/key_storage: vci.ka.key_storage
  /jwt/ka/payload/certification: vci.ka.certification
  /jwt/ka/payload/key_storage_status: vci.ka.key_storage_status
