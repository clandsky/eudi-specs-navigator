  /jwt/metadata/payload/issuer_info/*/format: vci.metadata.issuer_info.format
  /jwt/metadata/payload/issuer_info/*/data: vci.metadata.issuer_info.data
  /jwt/metadata/payload/credential_configurations_supported: vci.metadata.credential_configurations_supported
  /jwt/metadata/payload/credential_configurations_supported/*: vci.metadata.ccs.id
  /jwt/metadata/payload/credential_configurations_supported/*/format: vci.metadata.ccs.format
  /jwt/metadata/payload/credential_configurations_supported/*/vct: vci.metadata.ccs.vct
  /jwt/metadata/payload/credential_configurations_supported/*/credential_signing_alg_values_supported: vci.metadata.ccs.credential_signing_alg_values_supported
  /jwt/metadata/payload/credential_configurations_supported/*/cryptographic_binding_methods_supported: vci.metadata.ccs.cryptographic_binding_methods_supported
  /jwt/metadata/payload/credential_configurations_supported/*/proof_types_supported: vci.metadata.ccs.proof_types_supported
  /jwt/metadata/payload/credential_configurations_supported/*/proof_types_supported/*: vci.metadata.ccs.proof_type
  /jwt/metadata/payload/credential_configurations_supported/*/proof_types_supported/*/proof_signing_alg_values_supported: vci.metadata.ccs.proof_signing_alg_values_supported
  /jwt/metadata/payload/credential_configurations_supported/*/credential_metadata: vci.metadata.ccs.credential_metadata
