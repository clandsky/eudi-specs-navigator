  /jwt/metadata/payload/credential_configurations_supported/*/credential_metadata/display/**: vci.metadata.ccs.display
  /jwt/metadata/payload/credential_configurations_supported/*/credential_metadata/claims: vci.metadata.ccs.claims
  /jwt/metadata/payload/credential_configurations_supported/*/credential_metadata/claims/**: vci.metadata.ccs.claims
  /jwt/rc/header/typ: vci.registration-cert
  /jwt/rc/header/iat: vci.registration-cert
  /jwt/rc/payload: vci.registration-cert
  /jwt/rc/payload/*: vci.registration-cert
  /jwt/rc/payload/**: vci.registration-cert
  /jwt/rc/payload/entitlements: vci.registration-cert.entitlements
  /jwt/rc/payload/provides_attestations: vci.registration-cert.provides_attestations
  /jwt/rc/payload/provides_attestations/**: vci.registration-cert.provides_attestations
