  /jwt/metadata/payload/credential_response_encryption: vci.metadata.credential_response_encryption
  /jwt/metadata/payload/credential_response_encryption/alg_values_supported: vci.metadata.credential_response_encryption.alg_values_supported
  /jwt/metadata/payload/credential_response_encryption/enc_values_supported: vci.metadata.credential_response_encryption.enc_values_supported
  /jwt/metadata/payload/credential_response_encryption/encryption_required: vci.metadata.credential_response_encryption.encryption_required
  /jwt/metadata/payload/issuer_info: vci.metadata.issuer_info
