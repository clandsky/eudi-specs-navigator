id: vci-token-request-preauth-dyou
title: Token Request (pre-authorized code) with DPoP, without client attestation
subject: vci.token-request
kind: http-request
note: >-
  Shape recorded from a d-you issuance (IDGo 81, 2026-10-22): no OAuth-Client-Attestation or -PoP headers and no
  tx_code; the Wallet still sends a client_id (a UUID) as form parameter.
http:
  method: POST
  url: https://eaa.example.eu/openid4vci/token
  headers:
    Content-Type: application/x-www-form-urlencoded
    DPoP: "{{jwt:dpop}}"
  body:
    type: form
    value:
      grant_type: "urn:ietf:params:oauth:grant-type:pre-authorized_code"
      pre-authorized_code: kh_1vkpxLgHqvQwUYhZswmJ0ilAwuTE2kQb3K1nHVGE
      client_id: cbc61b45-907a-4c65-8467-3194d8af12ab
jwts:
  dpop:
    key: wallet-dpop
    header: { alg: ES256, jwk: { $jwk: wallet-dpop, alg: ES256, kid: dpop-e13a2796c5b2f6ad, use: sig }, typ: dpop+jwt }
    payload: { htu: https://eaa.example.eu/openid4vci/token, htm: POST, jti: 8LxFdIBzviqbHIPES7La, iat: 1792676865 }
annotations:
  /http/headers/DPoP: vci.token-request.dpop
  /http/body/grant_type: vci.token-request.grant_type
  /http/body/pre-authorized_code: vci.token-request.pre-authorized_code
  /http/body/client_id: vci.token-request.client_id
