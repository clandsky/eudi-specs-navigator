id: vci-credential-response-preauth-dyou
title: Encrypted Credential Response with one SD-JWT VC
subject: vci.credential-response
kind: http-response
note: >-
  Shape recorded from a d-you issuance (IDGo 81, 2026-10-22): a compact JWE (ECDH-ES, A128GCM) to the Wallet's
  response key, one SD-JWT VC without a status claim and no notification_id. The Wallet accepted and stored it.
http:
  status: 200
  headers: { Cache-Control: no-store, Content-Type: application/jwt }
  body: { type: jwt, value: "{{jwe:cresp}}" }
jwts:
  cresp:
    encrypt: { key: wallet-enc, alg: ECDH-ES, enc: A128GCM }
    header: { kid: 3ABFF099-0D8B-48F3-8F80-E431FDD1A5C0 }
    payload:
      credentials:
        - { credential: "{{sdjwt:vc1}}" }
  vc1:
    key: issuer-signer
    header: { x5c: "{{x5c:issuer-signer}}", typ: dc+sd-jwt, alg: ES256 }
    payload:
      vct: "urn:knuffingen:dog_tag:1"
      iss: https://eaa.example.eu
      cnf: { jwk: { $jwk: wallet-key-1, use: sig, kid: F44804AB-7778-487F-BC9E-7AA7462E6ED9, alg: ES256 } }
      exp: 1824212866
      iat: 1792676866
    disclosures:
      - { salt: x5Fveu8iaQLR9qLrvfgUHQ, name: pet_name, value: Bello }
      - { salt: ksE09UUdlK-CR7d_5P29mQ, name: pet_race, value: Labrador Retriever }
      - { salt: fR_g__2Efpvt_aeivBKgQg, name: owner_firstname, value: Erika }
      - { salt: kzi7hp1-LfMUpXYwNYzNCA, name: owner_lastname, value: Mustermann }
annotations:
  /http/headers/Content-Type: vci.credential-encryption
  /http/body: vci.credential-encryption
  /jwt/cresp/header/enc: vci.credential-encryption.enc
  /jwt/cresp/header/kid: vci.credential-encryption.kid
  /jwt/cresp/header/epk: vci.credential-encryption.epk
  /jwt/cresp/header/epk/*: vci.credential-encryption.epk
  /jwt/cresp/payload/credentials: vci.credential-response.credentials
  /jwt/cresp/payload/credentials/*/credential: vci.credential-response.credential
  /jwt/vc1/header/typ: sdjwtvc.typ
  /jwt/vc1/payload/iss: sdjwtvc.iss
  /jwt/vc1/payload/exp: sdjwtvc.exp
  /jwt/vc1/payload/cnf: sdjwtvc.cnf
