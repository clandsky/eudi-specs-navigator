  /jwt/ro/payload/client_metadata/vp_formats_supported/dc+sd-jwt/kb-jwt_alg_values: vp.request-object.client_metadata.kb-jwt_alg_values
  /jwt/ro/payload/verifier_info: vp.request-object.verifier_info
  /jwt/ro/payload/verifier_info/0: vp.request-object.verifier_info.registration_cert
  /jwt/ro/payload/verifier_info/*/format: vp.request-object.verifier_info.format
  /jwt/ro/payload/verifier_info/*/data: vp.request-object.verifier_info.data
  /jwt/vrc/header/typ: vp.request-object.verifier_info.registration_cert
  /jwt/vrc/header/iat: vp.request-object.verifier_info.registration_cert
  /jwt/vrc/header/x5c: vp.request-object.verifier_info.registration_cert
  /jwt/vrc/header/alg: vp.request-object.verifier_info.registration_cert
  /jwt/vrc/payload: vp.request-object.verifier_info.registration_cert
  /jwt/vrc/payload/*: vp.request-object.verifier_info.registration_cert
  /jwt/vrc/payload/**: vp.request-object.verifier_info.registration_cert
  /jwt/vrc/payload/credentials: vp.request-object.verifier_info.registration_cert.credential_ids
  /jwt/vrc/payload/credentials/**: vp.request-object.verifier_info.registration_cert.credential_ids
