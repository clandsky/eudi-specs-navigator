  /jwt/ro/payload/dcql_query/credentials/*/claims: vp.dcql.claims
  /jwt/ro/payload/dcql_query/credentials/*/claims/*/path: vp.dcql.path
  /jwt/ro/payload/client_metadata: vp.request-object.client_metadata
  /jwt/ro/payload/client_metadata/jwks: vp.request-object.client_metadata.jwks
  /jwt/ro/payload/client_metadata/jwks/keys: vp.request-object.client_metadata.jwks
  /jwt/ro/payload/client_metadata/jwks/keys/*/kid: vp.request-object.client_metadata.jwks.kid
  /jwt/ro/payload/client_metadata/jwks/keys/*/use: vp.request-object.client_metadata.jwks.use
  /jwt/ro/payload/client_metadata/jwks/keys/*/alg: vp.request-object.client_metadata.jwks.alg
  /jwt/ro/payload/client_metadata/encrypted_response_enc_values_supported: vp.request-object.client_metadata.enc_values
