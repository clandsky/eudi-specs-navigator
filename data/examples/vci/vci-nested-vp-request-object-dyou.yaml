id: vci-nested-vp-request-object-dyou
title: Signed Request Object of the authorization server with a registrar-signed registration certificate
note: >-
  Shape recorded from a d-you issuance with a nested PID presentation (IDGo 81, 2026-10-22). The authorization server reuses the request of its generic PID verifier: the pre-1.0 client_id_scheme next to
  the x509_hash prefix, aud https://self-issued.me/v2, a five-minute lifetime. The registration certificate in
  verifier_info is the one of that verifier registration (Service_Provider, a long list of PID claims), not the EAA
  provider's issuer registration.
subject: vp.request-uri-fetch
kind: http-response
http:
  status: 200
  headers: { Content-Type: application/oauth-authz-req+jwt }
  body: { type: jwt, value: "{{jwt:ro}}" }
jwts:
  ro:
    key: issuer-access
    header: { x5c: "{{x5c:issuer-access}}", typ: oauth-authz-req+jwt, alg: ES256 }
    payload:
      client_id: "{{x509hash:issuer-access}}"
      client_id_scheme: x509_hash
      iss: "{{x509hash:issuer-access}}"
      response_type: vp_token
      response_mode: direct_post.jwt
      response_uri: https://eaa.example.eu/openid4vp/response/91y-tdPk4uwy93FvF5PwoQ
      nonce: fxStHMiK3gSLXsQnOEsFNw5_322UoA0fA5l5t1TDi9A
      state: 91y-tdPk4uwy93FvF5PwoQ
      aud: https://self-issued.me/v2
      iat: 1792681845
      exp: 1792682145
      dcql_query:
        credentials:
          - id: pid-sd-jwt
            format: dc+sd-jwt
            meta: { vct_values: ["urn:eudi:pid:de:1"] }
            claims: [{ path: [given_name] }, { path: [family_name] }]
      client_metadata:
        jwks: { keys: [{ $jwk: as-vp-enc, kid: 17dfdd8b-ce68-41e6-9377-60ca5211e46c, use: enc, alg: ECDH-ES }] }
        vp_formats_supported:
          dc+sd-jwt: { sd-jwt_alg_values: [ES256], kb-jwt_alg_values: [ES256] }
        encrypted_response_enc_values_supported: [A128GCM]
      verifier_info:
        - { format: registration_cert, data: "{{jwt:vrc}}" }
  vrc:
    key: registrar
    header: { typ: rc-wrp+jwt, iat: 1791917970, x5c: "{{x5c:registrar}}", alg: ES256 }
    payload:
      name: Stadt Knuffingen
      sub_ln: Stadt Knuffingen
      sub: NTRDE-9BC70F9B649486D5
      country: DE
      registry_uri: https://registrar.example.eu/api
      srv_description: [[{ lang: en, value: Stadt Knuffingen }]]
      entitlements: ["https://uri.etsi.org/19475/Entitlement/Service_Provider"]
      privacy_policy: https://eaa.example.eu/privacy
      support_uri: https://eaa.example.eu/contact
      supervisory_authority: { email: dpa@example.eu, phone: "+49 228 0000000", uri: https://dpa.example.eu }
      iat: 1791917970
      status: { status_list: { idx: 3499, uri: https://registrar.example.eu/api/status-management/status-list } }
      purpose: [{ lang: de, value: Stadt Knuffingen }]
      credentials:
        - format: dc+sd-jwt
          meta: { vct_values: ["urn:eudi:pid:de:1"] }
          claim:
            - { path: [family_name] }
            - { path: [given_name] }
            - { path: [birthdate] }
            - { path: [place_of_birth, locality] }
            - { path: [nationalities] }
            - { path: [address, country] }
            - { path: [address, region] }
            - { path: [address, locality] }
            - { path: [address, postal_code] }
            - { path: [address, street_address] }
            - { path: [issuing_authority] }
            - { path: [issuing_country] }
            - { path: [birth_name] }
            - { path: [source_document_type] }
            - { path: [age_equal_or_over, "12"] }
            - { path: [age_equal_or_over, "14"] }
            - { path: [age_equal_or_over, "16"] }
            - { path: [age_equal_or_over, "18"] }
            - { path: [age_equal_or_over, "21"] }
            - { path: [age_equal_or_over, "65"] }
            - { path: [academic_title] }
            - { path: [raw_eid_birth_date] }
            - { path: [cnf, jwk] }
            - { path: [place_of_birth, no_place_info] }
      intermediary: { sub: NTRDE-9BC70F9B649486D5, sname: Stadt Knuffingen }
      act: { sub: NTRDE-9BC70F9B649486D5 }
      public_body: false
      jti: 6577b975-afe9-48e7-a42b-c0e9720d3a52
annotations:
  /http/headers/Content-Type: http.content-type
  /jwt/ro/header/typ: vp.request-object.typ
  /jwt/ro/header/x5c: vp.request-object.x5c
  /jwt/ro/payload/client_id: vp.request-object.client_id
  /jwt/ro/payload/client_id_scheme: vp.request-object.client_id_scheme
  /jwt/ro/payload/iss: vp.request-object.iss
  /jwt/ro/payload/response_type: vp.request-object.response_type
  /jwt/ro/payload/response_mode: vp.request-object.response_mode
  /jwt/ro/payload/response_uri: vp.request-object.response_uri
  /jwt/ro/payload/nonce: vp.request-object.nonce
