id: vci-token-request
title: Token Request (authorization code) with WIA, PoP and DPoP
subject: vci.token-request
kind: http-request
http:
  method: POST
  url: https://eaa.example.eu/token
  headers:
    Content-Type: application/x-www-form-urlencoded
    OAuth-Client-Attestation: "{{jwt:wia}}"
    OAuth-Client-Attestation-PoP: "{{jwt:pop}}"
    DPoP: "{{jwt:dpop}}"
  body:
    type: form
    value:
      grant_type: authorization_code
      code: SplxlOBeZQQYbYS6WxSbIA
      code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      redirect_uri: https://wallet.example.eu/cb
jwts:
  wia: { use: vci-wia/wia }
  pop:
    key: wallet-instance
    header: { typ: oauth-client-attestation-pop+jwt, alg: ES256 }
    payload: { iss: https://wallet-provider.example.eu/wallet-solution/eudi-wallet, aud: https://eaa.example.eu, jti: 6f1c2b7e-token-0002, iat: 1792072860 }
  dpop:
    key: wallet-dpop
    header: { typ: dpop+jwt, alg: ES256, jwk: "{{jwk:wallet-dpop}}" }
    payload: { jti: dpop-token-0001, htm: POST, htu: https://eaa.example.eu/token, iat: 1792072860 }
annotations:
  /http/headers/OAuth-Client-Attestation: vci.token-request.oauth-client-attestation
  /http/headers/OAuth-Client-Attestation-PoP: vci.token-request.oauth-client-attestation-pop
  /http/headers/DPoP: vci.token-request.dpop
  /http/body/grant_type: vci.token-request.grant_type
  /http/body/code: vci.token-request.code
  /http/body/code_verifier: vci.token-request.code_verifier
  /jwt/pop/header/typ: vci.wia-pop.typ
  /jwt/pop/payload/aud: vci.wia-pop.aud
  /jwt/pop/payload/jti: vci.wia-pop.jti
  /jwt/dpop/header/typ: vci.dpop-proof.typ
  /jwt/wia/header/typ: vci.wia.typ
  /jwt/wia/header/x5c: vci.wia.x5c
  /jwt/wia/payload/iss: vci.wia.iss
  /jwt/wia/payload/sub: vci.wia.sub
  /jwt/wia/payload/exp: vci.wia.exp
  /jwt/wia/payload/cnf: vci.wia.cnf
  /jwt/wia/payload/wallet_name: vci.wia.wallet_name
  /jwt/wia/payload/wallet_link: vci.wia.wallet_link
  /jwt/wia/payload/wallet_version: vci.wia.wallet_version
  /jwt/wia/payload/wallet_solution_certification_information: vci.wia.wallet_solution_certification_information
  /jwt/wia/payload/client_status: vci.wia.client_status
  /http/body/redirect_uri: vci.token-request.redirect_uri
