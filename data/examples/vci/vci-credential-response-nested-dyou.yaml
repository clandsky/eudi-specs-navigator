id: vci-credential-response-nested-dyou
title: Encrypted Credential Response with one SD-JWT VC, owner from the PID
subject: vci.credential-response
kind: http-response
note: >-
  Shape recorded from a d-you issuance with a nested PID presentation (IDGo 81, 2026-10-22): a compact JWE (ECDH-ES, A128GCM) to the Wallet's response key, one SD-JWT VC without a status claim. The owner's
  names are the given_name and family_name the Wallet presented from the PID, taken over as they came (upper case).
http:
  status: 200
  headers: { Cache-Control: no-store, Content-Type: application/jwt }
  body: { type: jwt, value: "{{jwe:cresp}}" }
jwts:
  cresp:
    encrypt: { key: wallet-enc, alg: ECDH-ES, enc: A128GCM }
    header: { kid: 5770BF1B-C95F-4963-AE3F-5DE219ED7BA6 }
    payload:
      credentials:
        - { credential: "{{sdjwt:vc1}}" }
  vc1:
    key: issuer-signer
    header: { x5c: "{{x5c:issuer-signer}}", typ: dc+sd-jwt, alg: ES256 }
    payload:
      vct: "urn:knuffingen:dog_tag:1"
      iss: https://eaa.example.eu
      cnf: { jwk: { $jwk: wallet-key-1, use: sig, kid: 08D48B8B-7E45-4783-8A5B-E7540A24C83B, alg: ES256 } }
      exp: 1824217338
      iat: 1792681338
    disclosures:
      - { salt: EwXnwTT0DjAIzssADiJ16Q, name: pet_name, value: Bello }
      - { salt: aJ0bjmGnDxwmUEtDCz3B3w, name: pet_race, value: Labrador Retriever }
      - { salt: l5eSJSLXmBZ5plIDjIDEMw, name: owner_firstname, value: ERIKA }
      - { salt: wDYiqjL0Z8KbnAxsYN8ajA, name: owner_lastname, value: MUSTERMANN }
annotations:
  /http/headers/Content-Type: vci.credential-encryption
  /http/body: vci.credential-encryption
  /jwt/cresp/header/enc: vci.credential-encryption.enc
  /jwt/cresp/header/kid: vci.credential-encryption.kid
  /jwt/cresp/header/epk: vci.credential-encryption.epk
  /jwt/cresp/header/epk/*: vci.credential-encryption.epk
  /jwt/cresp/payload/credentials: vci.credential-response.credentials
  /jwt/cresp/payload/credentials/*/credential: vci.credential-response.credential
  /jwt/vc1/header/typ: sdjwtvc.typ
  /jwt/vc1/payload/iss: sdjwtvc.iss
  /jwt/vc1/payload/exp: sdjwtvc.exp
  /jwt/vc1/payload/cnf: sdjwtvc.cnf
