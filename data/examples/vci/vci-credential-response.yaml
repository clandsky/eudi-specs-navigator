id: vci-credential-response
title: Credential Response with two SD-JWT VCs (one per attested key)
subject: vci.credential-response
kind: http-response
http:
  status: 200
  headers: { Content-Type: application/json }
  body:
    type: json
    value:
      credentials:
        - { credential: "{{sdjwt:vc1}}" }
        - { credential: "{{sdjwt:vc2}}" }
      notification_id: 3fwe98js
jwts:
  vc1:
    key: issuer-signer
    header: { typ: dc+sd-jwt, alg: ES256, x5c: "{{x5c:issuer-signer}}" }
    payload: { iss: https://eaa.example.eu, vct: "urn:eudi:example:gym-membership:1", iat: 1792072980, exp: 1823608980, cnf: { jwk: "{{jwk:wallet-key-1}}" } }
    disclosures:
      - { salt: 2GLC42sKQveCfGfryNRN9w, name: member_id, value: GYM-0042 }
      - { salt: eluV5Og3gSNII8EYnsxA_A, name: membership_level, value: gold }
  vc2:
    key: issuer-signer
    header: { typ: dc+sd-jwt, alg: ES256, x5c: "{{x5c:issuer-signer}}" }
    payload: { iss: https://eaa.example.eu, vct: "urn:eudi:example:gym-membership:1", iat: 1792072980, exp: 1823608980, cnf: { jwk: "{{jwk:wallet-key-2}}" } }
    disclosures:
      - { salt: 6Ij7tM-a5iVPGboS5tmvVA, name: member_id, value: GYM-0042 }
      - { salt: Qg_O64zqAxe412a108iroA, name: membership_level, value: gold }
annotations:
  /http/body/credentials: vci.credential-response.credentials
  /http/body/notification_id: vci.credential-response.notification_id
  /http/body/credentials/*/credential: vci.credential-response.credential
  /jwt/*/header/typ: sdjwtvc.typ
  /jwt/*/payload/iss: sdjwtvc.iss
  /jwt/*/payload/exp: sdjwtvc.exp
  /jwt/*/payload/cnf: sdjwtvc.cnf
