id: vci-nested-vp-response-post-dyou
title: Encrypted PID presentation posted to the authorization server (given_name, family_name)
note: >-
  Shape recorded from a d-you issuance with a nested PID presentation (IDGo 81, 2026-10-22): the URL, the form body and the JWE protected header (ECDH-ES with apu and apv, A128GCM, kid of the
  authorization server's ephemeral key). The PID inside was encrypted end to end and not recorded; the plaintext
  here is the spec example (sandbox test PID ERIKA MUSTERMANN).
subject: vp.response-post
kind: http-request
http:
  method: POST
  url: https://eaa.example.eu/openid4vp/response/91y-tdPk4uwy93FvF5PwoQ
  headers: { Content-Type: application/x-www-form-urlencoded }
  body: { type: form, value: { response: "{{jwe:resp}}" } }
jwts:
  resp:
    encrypt: { key: as-vp-enc, alg: ECDH-ES, enc: A128GCM }
    header: { apu: ZTBRdmgyTkdiWlcxMURuLTFGUkwwUQ, apv: ZnhTdEhNaUszZ1NMWHNRbk9Fc0ZOdzVfMzIyVW9BMGZBNWw1dDFURGk5QQ, kid: 17dfdd8b-ce68-41e6-9377-60ca5211e46c }
    payload:
      vp_token: { pid-sd-jwt: ["{{sdjwt:pid}}"] }
      state: 91y-tdPk4uwy93FvF5PwoQ
  pid:
    key: pid-issuer
    header: { typ: dc+sd-jwt, alg: ES256, x5c: "{{x5c:pid-issuer}}" }
    payload: { iss: https://pid-provider.example.de, vct: "urn:eudi:pid:de:1", iat: 1791936000, exp: 1793145600, cnf: { jwk: "{{jwk:wallet-key-1}}" }, status: { status_list: { idx: 107, uri: "https://pid-provider.example.de/status/abc3d468-799f-4fbc-85df-99e7f7192da0" } } }
    disclosures:
      - { salt: 2GLC42sKQveCfGfryNRN9w, name: given_name, value: ERIKA }
      - { salt: eluV5Og3gSNII8EYnsxA_A, name: family_name, value: MUSTERMANN }
    kb:
      key: wallet-key-1
      payload: { aud: "{{x509hash:issuer-access}}", nonce: fxStHMiK3gSLXsQnOEsFNw5_322UoA0fA5l5t1TDi9A, iat: 1792681851 }
annotations:
  /http/body/response: vp.response-post.response
  /jwt/resp/header/alg: vp.authorization-response.encryption
  /jwt/resp/header/enc: vp.authorization-response.enc
  /jwt/resp/header/kid: vp.authorization-response.kid
  /jwt/resp/header/apu: vp.authorization-response.encryption
  /jwt/resp/header/apv: vp.authorization-response.encryption
  /jwt/resp/header/epk: vp.authorization-response.encryption
  /jwt/resp/header/epk/*: vp.authorization-response.encryption
  /jwt/resp/payload/vp_token: vp.vp_token
  /jwt/resp/payload/vp_token/*: vp.dcql.id
  /jwt/resp/payload/state: vp.request-object.state
  /jwt/pid/header/typ: sdjwtvc.typ
  /jwt/pid/payload/iss: sdjwtvc.iss
  /jwt/pid/payload/exp: sdjwtvc.exp
  /jwt/pid/payload/cnf: sdjwtvc.cnf
  /jwt/pid-kb/header/typ: vp.kb-jwt.typ
  /jwt/pid-kb/payload/sd_hash: vp.kb-jwt.sd_hash
  /jwt/pid-kb/payload/aud: vp.kb-jwt.aud
  /jwt/pid-kb/payload/nonce: vp.kb-jwt.nonce
