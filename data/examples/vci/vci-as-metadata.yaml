id: vci-as-metadata
title: Authorization Server metadata (RFC 8414)
subject: vci.as-metadata
kind: http-response
http:
  status: 200
  headers: { Content-Type: application/json }
  body:
    type: json
    value:
      issuer: https://eaa.example.eu
      authorization_endpoint: https://eaa.example.eu/authorize
      token_endpoint: https://eaa.example.eu/token
      pushed_authorization_request_endpoint: https://eaa.example.eu/par
      require_pushed_authorization_requests: true
      response_types_supported: [code]
      grant_types_supported: [authorization_code, "urn:ietf:params:oauth:grant-type:pre-authorized_code", refresh_token]
      code_challenge_methods_supported: [S256]
      token_endpoint_auth_methods_supported: [attest_jwt_client_auth]
      client_attestation_signing_alg_values_supported: [ES256]
      client_attestation_pop_signing_alg_values_supported: [ES256]
      dpop_signing_alg_values_supported: [ES256]
      authorization_response_iss_parameter_supported: true
annotations:
  /http/body/issuer: vci.as-metadata.issuer
  /http/body/pushed_authorization_request_endpoint: vci.as-metadata.pushed_authorization_request_endpoint
  /http/body/token_endpoint_auth_methods_supported: vci.as-metadata.token_endpoint_auth_methods_supported
  /http/body/client_attestation_signing_alg_values_supported: vci.as-metadata.client_attestation_signing_alg_values_supported
  /http/body/client_attestation_pop_signing_alg_values_supported: vci.as-metadata.client_attestation_pop_signing_alg_values_supported
  /http/body/dpop_signing_alg_values_supported: vci.as-metadata.dpop_signing_alg_values_supported
  /http/body/authorization_endpoint: vci.as-metadata.authorization_endpoint
  /http/body/token_endpoint: vci.as-metadata.token_endpoint
  /http/body/require_pushed_authorization_requests: vci.as-metadata.require_pushed_authorization_requests
  /http/body/response_types_supported: vci.as-metadata.response_types_supported
  /http/body/grant_types_supported: vci.as-metadata.grant_types_supported
  /http/body/code_challenge_methods_supported: vci.as-metadata.code_challenge_methods_supported
  /http/body/authorization_response_iss_parameter_supported: vci.as-metadata.authorization_response_iss_parameter_supported
