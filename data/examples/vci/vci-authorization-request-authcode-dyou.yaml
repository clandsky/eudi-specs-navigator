id: vci-authorization-request-authcode-dyou
title: Authorization Request by reference, with state repeated
subject: vci.authorization-request
kind: uri
note: >-
  Shape recorded from a d-you issuance in the authorization code flow (IDGo 81, 2026-10-22, login at the authorization endpoint). The Wallet opens the authorization endpoint in the phone's browser and repeats state next to client_id and
  request_uri. The authorization server answers with its login form.
