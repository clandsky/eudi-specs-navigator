id: vci-refresh-credential-response
title: Credential Response with two refreshed SD-JWT VCs
subject: vci.credential-response
kind: http-response
note: >-
  The refreshed credentials carry a new iat, a validity of one more year and status entries of their own. The claim
  values are unchanged; the issuer decides whether a refresh updates them. The credentials issued before stay valid.
http:
  status: 200
  headers: { Content-Type: application/json }
  body:
    type: json
    value:
      credentials:
        - { credential: "{{sdjwt:vc1}}" }
        - { credential: "{{sdjwt:vc2}}" }
      notification_id: 7kqp21zx
jwts:
  vc1:
    key: issuer-signer
    header: { typ: dc+sd-jwt, alg: ES256, x5c: "{{x5c:issuer-signer}}" }
    payload: { iss: https://eaa.example.eu, vct: "urn:eudi:example:gym-membership:1", iat: 1794744180, exp: 1826280180, cnf: { jwk: "{{jwk:wallet-key-1}}" }, status: { status_list: { idx: 4021, uri: "https://eaa.example.eu/status/gym/3" } } }
    disclosures:
      - { salt: kT3nQ8wZr1VbYp6LsDx0Hg, name: member_id, value: GYM-0042 }
      - { salt: Fm2Jc7Ua9eXo4RiN5tWq1A, name: membership_level, value: gold }
  vc2:
    key: issuer-signer
    header: { typ: dc+sd-jwt, alg: ES256, x5c: "{{x5c:issuer-signer}}" }
    payload: { iss: https://eaa.example.eu, vct: "urn:eudi:example:gym-membership:1", iat: 1794744180, exp: 1826280180, cnf: { jwk: "{{jwk:wallet-key-2}}" }, status: { status_list: { idx: 3368, uri: "https://eaa.example.eu/status/gym/3" } } }
    disclosures:
      - { salt: Pz8Wd4Ks6nHq0Lc2Gv9YtB, name: member_id, value: GYM-0042 }
      - { salt: Xb5Re1Jm7aTu3Oi8Nf4SkC, name: membership_level, value: gold }
annotations:
  /http/body/credentials: vci.credential-response.credentials
  /http/body/notification_id: vci.credential-response.notification_id
  /http/body/credentials/*/credential: vci.credential-response.credential
  /jwt/*/header/typ: sdjwtvc.typ
  /jwt/*/payload/iss: sdjwtvc.iss
  /jwt/*/payload/exp: sdjwtvc.exp
  /jwt/*/payload/cnf: sdjwtvc.cnf
