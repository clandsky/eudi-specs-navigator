# TEST ONLY. Keys and certificates for the example objects. Never use them outside this repository.
# A key with `cert` gets an X.509 certificate; `issuer` names the signing key (absent = self-signed trust anchor,
# which is excluded from every x5c chain).
keys:
  - id: wp-root
    cert: { cn: "TEST Wallet Provider Root CA", ca: true }
  - id: wp-signer
    cert: { cn: "TEST Wallet Provider Attestation Signer", issuer: wp-root }
  - id: access-root
    cert: { cn: "TEST Access Certificate Root CA", ca: true }
  - id: issuer-access
    cert: { cn: "TEST EAA Provider Access Certificate", issuer: access-root }
  - id: issuer-signer
    cert: { cn: "TEST EAA Provider Credential Signer", issuer: access-root }
  - id: wallet-instance   # cnf key of the WIA, signs the client attestation PoP
  - id: wallet-key-1      # attested in the key attestation, signs the jwt proof
  - id: wallet-key-2
  - id: wallet-dpop       # DPoP proof key
  - id: verifier-access     # RP access certificate, signs the Request Object (x509_hash client identifier)
    cert: { cn: "TEST Relying Party Access Certificate", issuer: access-root }
  - id: verifier-enc        # ephemeral response-encryption key published in client_metadata.jwks
  - id: as-vp-enc           # the authorization server's response-encryption key when it asks for the PID (nested presentation)
  - id: pid-issuer          # signs the PID SD-JWT VC that the wallet presents
    cert: { cn: "TEST PID Provider Signer", issuer: access-root }
  - id: issuer-enc          # credential request encryption key published in credential_request_encryption.jwks
  - id: wallet-enc          # ephemeral credential response encryption key sent in the Credential Request
  - id: registrar-root      # trust anchor of the registrar that signs registration certificates
    cert: { cn: "TEST Registrar Root CA", ca: true }
  - id: registrar           # signs the EAA provider's registration certificate (issuer_info)
    cert: { cn: "TEST Registrar", issuer: registrar-root }
