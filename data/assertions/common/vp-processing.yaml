# SD-JWT (RFC 9901), SD-JWT VC, Token Status List and JWT: how the Verifier processes a presented SD-JWT VC.
- id: rfc9901/7.1/issuer-signature
  subject: vp.verifier.verify-issuer-signature
  spec: rfc-9901
  locator: { section: "7.1" }
  relation: defines
  level: shall
  applies_to: { role: [ verifier ] }
  quote: >-
    The "none" algorithm MUST NOT be accepted. … Validate the signature over the Issuer-signed JWT per Section 5.2 of
    [RFC7515]. … Validate the Issuer and that the signing key belongs to this Issuer.
  verified: source-checked
- id: sdjwtvc-13/3.4/issuer-key
  subject: vp.verifier.verify-issuer-signature
  spec: sd-jwt-vc-13
  locator: { section: "3.4" }
  relation: profiles
  level: shall
  applies_to: { role: [ verifier ] }
  quote: >-
    MUST be satisfied by determining and validating the public verification key used to verify the Issuer-signed JWT,
    employing an Issuer Signature Mechanism (defined in Section 3.5) that is permitted for the Issuer according to
    policy.
  verified: source-checked
- id: sdjwtvc-13/3.5/x5c
  subject: vp.verifier.verify-issuer-signature
  spec: sd-jwt-vc-13
  locator: { section: "3.5" }
  relation: defines
  level: info
  applies_to: { role: [ verifier ] }
  quote: >-
    When the protected header of the Issuer-signed JWT contains the x5c parameter, the recipient uses the public key
    from the end-entity certificate of the certificates from that x5c parameter and validates the X.509 certificate
    chain accordingly. In this case, the Issuer of the Verifiable Credential is the subject of the end-entity
    certificate.
  verified: source-checked
- id: sdjwtvc-13/3.5/reject
  subject: vp.verifier.verify-issuer-signature
  spec: sd-jwt-vc-13
  locator: { section: "3.5" }
  relation: profiles
  level: shall
  applies_to: { role: [ verifier ] }
  quote: >-
    If a recipient cannot validate that the public verification key corresponds the Issuer of the Issuer-signed JWT
    using a permitted Issuer Signature Mechanism, the SD-JWT VC MUST be rejected.
  verified: source-checked
- id: rfc9901/7.1/disclosures
  subject: vp.verifier.verify-disclosures
  spec: rfc-9901
  locator: { section: "7.1" }
  relation: defines
  level: shall
  applies_to: { role: [ verifier ] }
  quote: >-
    Check that the _sd_alg claim value is understood and the hash algorithm is deemed secure according to the Holder or
    Verifier's policy … Calculate the digest over the base64url-encoded string as described in Section 4.2.3.
  verified: source-checked
- id: rfc9901/7.1/unreferenced
  subject: vp.verifier.verify-disclosures
  spec: rfc-9901
  locator: { section: "7.1" }
  relation: defines
  level: shall
  applies_to: { role: [ verifier ] }
  quote: >-
    If any digest value is encountered more than once in the Issuer-signed JWT payload (directly or recursively via
    other Disclosures), the SD-JWT MUST be rejected. … If any Disclosure was not referenced by digest value in the
    Issuer-signed JWT (directly or recursively via other Disclosures), the SD-JWT MUST be rejected.
  verified: source-checked
- id: rfc9901/7.3/kb-jwt
  subject: vp.verifier.verify-kb-jwt
  spec: rfc-9901
  locator: { section: "7.3" }
  relation: defines
  level: shall
  applies_to: { role: [ verifier ] }
  quote: >-
    Validate the signature over the Key Binding JWT per Section 5.2 of [RFC7515]. … Check that the typ of the Key
    Binding JWT is kb+jwt … Check that the creation time of the Key Binding JWT, as determined by the iat claim, is
    within an acceptable window. … Determine that the Key Binding JWT is bound to the current transaction and was
    created for this Verifier (replay detection) by validating nonce and aud claims. … Calculate the digest over the
    Issuer-signed JWT and Disclosures as defined in Section 4.3.1 and verify that it matches the value of the sd_hash
    claim in the Key Binding JWT.
  verified: source-checked
- id: sdjwtvc-13/3.4/kb-cnf
  subject: vp.verifier.verify-kb-jwt
  spec: sd-jwt-vc-13
  locator: { section: "3.4" }
  relation: profiles
  level: shall
  applies_to: { role: [ verifier ] }
  quote: To verify the KB-JWT, the cnf claim of the SD-JWT MUST be used.
  verified: source-checked
- id: rfc9901/7.1/validity
  subject: vp.verifier.check-validity
  spec: rfc-9901
  locator: { section: "7.1" }
  relation: defines
  level: shall
  applies_to: { role: [ verifier ] }
  quote: >-
    Check that the SD-JWT is valid using claims such as nbf, exp, and aud in the processed payload, if present. If a
    required validity-controlling claim is missing (see Section 9.7), the SD-JWT MUST be rejected.
  verified: source-checked
- id: rfc7519/4.1.4/exp-verifier
  subject: vp.verifier.check-validity
  spec: rfc-7519
  locator: { section: "4.1.4" }
  relation: defines
  level: shall
  quote: >-
    The "exp" (expiration time) claim identifies the expiration time on or after which the JWT MUST NOT be accepted for
    processing.
  verified: source-checked
- id: sdjwtvc-13/3.4/status
  subject: vp.verifier.check-status
  spec: sd-jwt-vc-13
  locator: { section: "3.4" }
  relation: profiles
  level: should
  applies_to: { role: [ verifier ] }
  quote: >-
    If status is present in the verified payload of the SD-JWT, the status SHOULD be checked. It depends on the Verifier
    policy to reject or accept a presentation of a SD-JWT VC based on the status of the Verifiable Credential.
  verified: source-checked
- id: tsl-20/8.3/order
  subject: vp.verifier.check-status
  spec: status-list-20
  locator: { section: "8.3" }
  relation: defines
  level: shall
  applies_to: { role: [ verifier ] }
  condition: When the Verifier evaluates the status of the presented credential.
  quote: >-
    Upon receiving a Referenced Token, a Relying Party MUST first perform the validation of the Referenced Token - e.g.,
    checking for expected attributes, valid signature and expiration time.
  verified: source-checked
