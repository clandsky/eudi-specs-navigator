- id: oid4vci/11.1/notification_id
  subject: vci.notification-request.notification_id
  spec: openid4vci-1.0
  locator: { section: "11.1" }
  relation: defines
  level: shall
  applies_to: { role: [ wallet ] }
  quote: "notification_id: REQUIRED. String received in the Credential Response or Deferred Credential Response
    identifying an issuance flow"
  verified: source-checked
- id: oid4vci/F.1/iat
  subject: vci.proof-jwt.iat
  spec: openid4vci-1.0
  locator: { section: "F.1" }
  relation: defines
  level: shall
  applies_to: { role: [ wallet ] }
  quote: "iat: REQUIRED (number). The value of this claim MUST be the time at which the key proof was issued using the
    syntax defined in [RFC7519]."
  verified: source-checked
- id: oid4vci/D.1/user_authentication
  subject: vci.ka.key_storage
  spec: openid4vci-1.0
  locator: { section: "D.1" }
  relation: defines
  level: may
  applies_to: { role: [ wallet-provider ] }
  quote: "user_authentication : OPTIONAL. A non-empty array of case sensitive strings that assert the attack potential
    resistance of the user authentication methods allowed to access the private keys from the attested_keys parameter."
  verified: source-checked
- id: oid4vci/F.1/ka-nonce
  subject: vci.ka.nonce
  spec: openid4vci-1.0
  locator: { section: "F.1" }
  relation: defines
  level: shall
  applies_to: { role: [ wallet-provider, wallet ] }
  condition: When the key attestation travels in a jwt proof and the Credential Issuer provided a c_nonce.
  quote: "key_attestation: OPTIONAL. JOSE Header containing a key attestation as described in Appendix D. If the
    Credential Issuer provided a c_nonce, the nonce claim in the key attestation MUST be set to a server-provided
    c_nonce."
  note: >-
    ETSI CRED-REQ-4.6.1.2-02 and CIR TR_KA-6.1 also put the nonce into the jwt proof, and CIR C_KA-2 asks for it in the
    key attestation only for the attestation proof type; neither excludes it here, so this base rule stands. It means
    the key attestation is obtained per issuance, after the c_nonce (consistent with CIR TR_KA-2.4: one key attestation
    per issuance). The flows show it that way.
  verified: source-checked
- id: oid4vci/E/status
  subject: vci.wia.client_status.status
  spec: openid4vci-1.0
  locator: { section: "E" }
  relation: defines
  level: may
  applies_to: { role: [ wallet-provider ] }
  quote: "status: OPTIONAL. Status mechanism for the Wallet Attestation as defined in [I-D.ietf-oauth-status-list]"
  note: OpenID4VCI defines a top-level status claim; the CIR places the status reference inside client_status instead.
  verified: source-checked
- id: oid4vci/7.2/dpop-nonce
  subject: vci.nonce-response.dpop-nonce
  spec: openid4vci-1.0
  locator: { section: "7.2" }
  relation: defines
  level: may
  applies_to: { role: [ issuer ] }
  quote: "The Credential Issuer MAY provide a DPoP nonce in an HTTP header as defined in Section 8.2 of [RFC9449]."
