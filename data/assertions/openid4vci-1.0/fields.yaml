  verified: source-checked
- id: oid4vci/7.2/dpop-nonce-use
  subject: vci.dpop-proof.nonce
  spec: openid4vci-1.0
  locator: { section: "7.2" }
  relation: defines
  level: shall
  applies_to: { role: [ wallet ] }
  condition: When the Nonce Response carried a DPoP-Nonce header.
  quote: "In this case, the Wallet uses the new nonce value in the DPoP proof when presenting an access token at the
    Credential Endpoint."
  verified: source-checked
- id: oid4vci/11/access-token
  subject: vci.notification-request.dpop
  spec: openid4vci-1.0
  locator: { section: "11" }
  relation: defines
  level: shall
  applies_to: { role: [ wallet ] }
  quote: "The Wallet MUST present to the Notification Endpoint a valid Access Token issued at the Token Endpoint as
    defined in Section 6."
  verified: source-checked
- id: oid4vci/3.4/user-authentication
  subject: vci.user-authentication
  spec: openid4vci-1.0
  locator: { section: "3.4" }
  relation: defines
  level: info
  applies_to: { grant: [ authorization_code ] }
  quote: "The Authorization Endpoint processes the Authorization Request, which typically includes authenticating the
    End-User and gathering End-User consent."
  verified: source-checked
- id: oid4vci/3.4/credential-presentation
  subject: vci.user-authentication.pid-presentation
  spec: openid4vci-1.0
  locator: { section: "3.4" }
  relation: defines
  level: info
  applies_to: { grant: [ authorization_code ] }
  quote: "The Authorization Server and the User Agent may exchange any further messages between the steps if required
    by the Authorization Server to authenticate the End-User. For example, the Authorization Server may request
    Credential presentation as a means to authenticate or identify the End-User during the issuance flow"
  note: "Informative note; the flow it points to is Appendix H.5."
  verified: source-checked
- id: oid4vci/F.1/ka-nonce-step
  subject: vci.ka-request
  spec: openid4vci-1.0
  locator: { section: "F.1" }
  relation: defines
  level: shall
  applies_to: { role: [ wallet ] }
  condition: When the Credential Issuer provided a c_nonce.
  quote: "If the Credential Issuer provided a c_nonce, the nonce claim in the key attestation MUST be set to a
    server-provided c_nonce."
  verified: source-checked
