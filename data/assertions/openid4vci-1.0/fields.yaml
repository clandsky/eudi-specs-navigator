- id: oid4vci/F.1/ka-nonce
  subject: vci.ka.nonce
  spec: openid4vci-1.0
  locator: { section: "F.1" }
  relation: defines
  level: shall
  applies_to: { role: [ wallet-provider, wallet ] }
  condition: When the key attestation travels in a jwt proof and the Credential Issuer provided a c_nonce.
  quote: "key_attestation: OPTIONAL. JOSE Header containing a key attestation as described in Appendix D. If the
    Credential Issuer provided a c_nonce, the nonce claim in the key attestation MUST be set to a server-provided
    c_nonce."
  verified: needs-review
  review:
    reason: >-
      OpenID4VCI F.1 requires the c_nonce inside the key attestation when it travels in a jwt proof. ETSI
      CRED-REQ-4.6.1.2-02 and CIR TR_KA-6.1 put the nonce in the jwt proof, and CIR C_KA-2 requires it in the key
      attestation only for the attestation proof type. A key attestation provisioned in advance by the Wallet Provider
      (TR_KA-2.5) cannot contain an issuer's c_nonce. No higher layer says the base rule does not apply, so it stands;
      the phase-1 example (pre-provisioned key attestation without nonce) does not meet it.
