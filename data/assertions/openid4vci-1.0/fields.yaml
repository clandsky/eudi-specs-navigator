- id: oid4vci/8.3/credential
  subject: vci.credential-response.credential
  spec: openid4vci-1.0
  locator: { section: "8.3" }
  relation: defines
  level: shall
  applies_to: { role: [ issuer ] }
  quote: "credential: REQUIRED. Contains one issued Credential. The encoding of the Credential depends on the Credential
    Format and MAY be a string or an object."
