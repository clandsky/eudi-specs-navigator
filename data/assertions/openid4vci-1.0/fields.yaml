# OpenID4VCI 1.0: members that complete every field of the phase-1 examples.
- id: oid4vci/12.2.2/content-type
  subject: vci.metadata.content-type
  spec: openid4vci-1.0
  locator: { section: "12.2.2" }
  relation: defines
  level: shall
  applies_to: { role: [ issuer ] }
  quote: "MAY support returning it in a signed form 'application/jwt'. In all cases the Credential Issuer MUST indicate
    the media type of the returned Metadata using the HTTP Content-Type header."
