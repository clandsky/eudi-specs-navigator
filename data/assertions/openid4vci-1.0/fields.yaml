  verified: source-checked
- id: oid4vci/12.2.4/key_attestations_required-values
  subject: vci.metadata.ccs.key_attestations_required.values
  spec: openid4vci-1.0
  locator: { section: "12.2.4" }
  relation: defines
  level: may
  applies_to: { role: [ issuer ] }
  quote: "key_storage: OPTIONAL. A non-empty array defining values specified in Appendix D.2 accepted by the Credential
    Issuer. user_authentication: OPTIONAL. A non-empty array defining values specified in Appendix D.2 accepted by the
    Credential Issuer."
  verified: source-checked
- id: oid4vci/12.2.4/credential_metadata
  subject: vci.metadata.ccs.credential_metadata
  spec: openid4vci-1.0
  locator: { section: "12.2.4" }
