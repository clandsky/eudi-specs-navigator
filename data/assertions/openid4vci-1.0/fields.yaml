- id: oid4vci/12.2.4/proof_signing_alg_values_supported
  subject: vci.metadata.ccs.proof_signing_alg_values_supported
  spec: openid4vci-1.0
  locator: { section: "12.2.4" }
  relation: defines
  level: shall
  applies_to: { role: [ issuer ] }
