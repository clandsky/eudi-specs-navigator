  target: etsi-472-2/OIDFVP-HAIP-COMMON-REQ-RO-23
  quote: "OIDFVP-HAIP-COMMON-REQ-RO-23: The leaf certificate mentioned in OpenID4VP section 5.9.3 for use with the
