# CIR (EU) 2026/1731 Annex XII = new Annex II to 2024/2982: ETSI TS 119 472-2 V1.2.1 clauses 4.1, 4.2, 5, 6 apply
# with adaptations.
- id: cir/annex-xii/scope-haip-redirect
  subject: vp.authorization-response.encryption
  spec: cir-2026-1731
  locator: { at: "Annex XII, adaptation (1) of clause 1 Scope, point (b)" }
  relation: profiles
  level: info
  applies_to: { transport: [ redirect ] }
  quote: "Sections 5, 5.1, 5.3, 7, and 8 of [11] for transmission via Redirects or non-API mediated transmission mechanism"
  note: "[11] is OpenID4VC-HAIP. HAIP §5 and §5.1 (response encryption) stay in scope for the redirect mechanism."
  verified: source-checked
