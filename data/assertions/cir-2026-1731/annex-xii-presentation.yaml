- id: cir/annex-xii/OIDFVP-HAIP-SUPPORT-03
  subject: vp.cross-device-redirect
  spec: cir-2026-1731
  locator: { req: OIDFVP-HAIP-SUPPORT-03, at: "Annex XII, adaptation (13), clause 6.2" }
  relation: adapts
  level: should-not
  applies_to: { role: [ wallet ] }
  target: etsi-472-2/OIDFVP-HAIP-SUPPORT-03
  quote: "OIDFVP-HAIP-SUPPORT-03: The EUDI Wallet should not support the redirects-based mechanism specified in clause 6.4
    for cross-device presentation flows."
  note: Annex XII NOTE 3 adds that implementing the mechanism should not trigger non-compliance; mitigating session
    fixation is up to relying parties.
  verified: source-checked
- id: cir/annex-xii/OIDFVP-HAIP-COMMON-REQ-01
  subject: vp.request-object.client_id
  spec: cir-2026-1731
  locator: { req: OIDFVP-HAIP-COMMON-REQ-01, at: "Annex XII, adaptation (15), clause 6.3.2.1" }
  relation: voids
  target: etsi-472-2/OIDFVP-HAIP-COMMON-REQ-01
  quote: "OIDFVP-HAIP-COMMON-REQ-01: void."
  note: HAIP §5 still requires x509_hash for signed requests and stays in scope (Annex XII adaptation 1(b)); the void only
    removes the ETSI duplicate.
  verified: source-checked
- id: cir/annex-xii/OIDFVP-HAIP-COMMON-REQ-RO-23
