- id: cir/annex-xii/OIDFVP-HAIP-ADD-API-05
  subject: vp.dc-api.proximity
  spec: cir-2026-1731
  locator: { req: OIDFVP-HAIP-ADD-API-05, at: "Annex XII, adaptation (19), clause 6.5.2" }
  relation: replaces
  level: shall
  applies_to: { role: [ wallet ], device: [ cross ] }
  target: etsi-472-2/OIDFVP-HAIP-ADD-API-05
  quote: "OIDFVP-HAIP-ADD-API-05: EUDI Wallets shall verify, in cross-device flows, using the mediating API, that the
    interacting device is in close physical proximity to the EUDI Wallet"
  verified: source-checked
- id: cir/annex-xii/WRP-VALIDATION-01
  subject: vp.wallet.validate-registration-cert
  spec: cir-2026-1731
  locator: { req: WRP-VALIDATION-01, at: "Annex XII, adaptation (6), new clause 4.4" }
  relation: extends
  level: shall
  applies_to: { role: [ wallet ] }
  quote: "WRP-VALIDATION-01: The EUDI Wallet shall validate the wallet-relying party registration certificate received in
    the request before presenting any requested PID or electronic attestation of attributes to the wallet user for
    approval."
  verified: needs-review
  review:
    reason: >-
      Annex XII states this without a date, while Article 3(4) of 2024/2982 (same obligation) applies only from 11
      August 2028 and recital 6 says the requirement should only apply as of that date.
- id: cir/annex-xii/WRP-OVERASKING-01
  subject: vp.wallet.overasking
  spec: cir-2026-1731
  locator: { req: WRP-OVERASKING-01, at: "Annex XII, adaptation (6), new clause 4.4" }
  relation: extends
  level: shall
  applies_to: { role: [ wallet ] }
  quote: "WRP-OVERASKING-01: The EUDI Wallet shall compare the attestations and attributes requested by the wallet-relying
    party with the registered attestations and attributes in the wallet-relying party registration certificate."
  verified: source-checked
- id: cir/annex-xii/WRP-OVERASKING-02
  subject: vp.wallet.overasking
  spec: cir-2026-1731
  locator: { req: WRP-OVERASKING-02, at: "Annex XII, adaptation (6), new clause 4.4" }
  relation: extends
  level: shall
  applies_to: { role: [ wallet ] }
  quote: "the EUDI Wallet shall clearly warn the wallet user before any disclosure. The warning shall identify that the
    wallet-relying party is requesting more information than it has registered."
  verified: source-checked
