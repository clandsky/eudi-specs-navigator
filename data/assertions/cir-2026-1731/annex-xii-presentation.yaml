- id: cir/annex-xii/OIDFVP-HAIP-COMMON-RESP-01
  subject: vp.authorization-response.encryption
  spec: cir-2026-1731
  locator: { req: OIDFVP-HAIP-COMMON-RESP-01, at: "Annex XII, adaptation (17), clause 6.3.3" }
  relation: voids
  target: etsi-472-2/OIDFVP-HAIP-COMMON-RESP-01
  quote: "OIDFVP-HAIP-COMMON-RESP-01: void."
  verified: needs-review
  review:
    reason: >-
      Void without effect: the CIR removes the ETSI duplicate, but HAIP §5 ("Response encryption MUST be performed") and
      §5.1/§5.2 stay in scope through the adapted Scope clause 1(b). Encryption remains required. Whether the legislator
      intended to relax encryption is not stated.
