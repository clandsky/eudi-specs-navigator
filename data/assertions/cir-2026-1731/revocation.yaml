# CIR (EU) 2026/1731 on revoking issued attestations (SD-JWT VC and mdoc alike): when a PID provider must revoke
# (Article 1(3), amending Article 5(4)(b) of 2024/2977; Annex III LC_GEN-4), and which status values the PID, QEAA and
# PuB-EAA may use (Annex IV, adaptations (2) and (3)). The mdoc-specific clause 6.2.10.1 is in annex-iv-mso-revocation.yaml.
- id: cir/art-1-3/2977-art-5-4-b
  subject: vci.revocation.decision
  spec: cir-2026-1731
  locator: { at: "Article 1(3), replacing Article 5(4), point (b), of Implementing Regulation (EU) 2024/2977" }
  relation: extends
  level: shall
  applies_to: { role: [ issuer ] }
  condition: For PID providers. The other cases of Article 5(4) of 2024/2977 are not in the corpus.
  quote: "where the wallet unit attestation of the wallet unit to which the person identification data was issued to has
    been revoked;"
  note: One of the cases in which Article 5(4) of 2024/2977 has the PID provider revoke the PID; LC_GEN-4 says how it
    learns about it.
  verified: source-checked
- id: cir/LC_GEN-4
  subject: vci.issuer.revocation-chaining
  spec: cir-2026-1731
  locator: { req: LC_GEN-4, at: "Annex III (Annex Ib), point 2(d)" }
  relation: extends
  level: shall
  applies_to: { role: [ issuer ] }
  condition: For PID providers whose PID has a technical validity period of more than 24 hours.
  quote: "LC_GEN-4: A provider of person identification data having a technical validity period of more than 24 hours
    shall check the revocation status of both the wallet instance attestation and the key attestation received during
    issuance at least once every 24 hours, during the technical validity period of the person identification data. Where
    either is revoked, the provider shall revoke the person identification data."
  note: Revocation chaining. LC_GEN-1 keeps WIA and key attestation status at least 31 days ahead, so a PID provider need
    not issue short-lived PIDs to rely on it.
  verified: source-checked
- id: cir/annex-iv/EAA-4.2.11.1-06
  subject: vci.issuer.update-status-list
  spec: cir-2026-1731
  locator: { req: EAA-4.2.11.1-06, at: "Annex IV, adaptation (2), clause 4.2.11.1" }
  relation: profiles
  level: shall
  applies_to: { role: [ issuer ] }
  condition: For the PID, qualified EAA and EAA provided by or on behalf of a public sector body responsible for an
    authentic source.
  quote: "EAA-4.2.11.1-06: When a status element is used for person identification data, qualified electronic attestations
    of attributes, or electronic attestations of attributes provided by or on behalf of a public sector body responsible
    for an authentic source, it shall only indicate whether the attestation is revoked or not revoked and shall not
    support any other status values, such as suspension."
  note: Restricts the Token Status List status types (§7.1) to 0x00 VALID and 0x01 INVALID; no SUSPENDED. An ordinary EAA,
    like the gym membership of the example, may still suspend.
  verified: source-checked
- id: cir/annex-iv/EAA-4.2.11.1-06.1
  subject: vci.issuer.update-status-list
  spec: cir-2026-1731
  locator: { req: EAA-4.2.11.1-06.1, at: "Annex IV, adaptation (2), clause 4.2.11.1" }
  relation: profiles
  level: shall
  applies_to: { role: [ issuer ] }
  condition: For the PID, qualified EAA and EAA provided by or on behalf of a public sector body responsible for an
    authentic source.
  quote: "EAA-4.2.11.1-06.1: Where an attestation is revoked, it shall be permanently revoked."
  verified: source-checked
- id: cir/annex-iv/EAA-4.2.13-03
  subject: vci.revocation
  spec: cir-2026-1731
  locator: { req: EAA-4.2.13-03, at: "Annex IV, adaptation (3), clause 4.2.13" }
  relation: profiles
  level: info
  applies_to: { role: [ issuer ] }
  condition: Short-lived EAA, valid for 24 hours or less.
  quote: "EAA-4.2.13-03: Where short-lived electronic attestations of attributes with a validity period of 24 hours or
    less are issued, revocation shall not be required."
  note: An exemption, not a level of its own; the mdoc clause has the same rule (EAA-6.2.10.1-02.1).
  verified: source-checked
