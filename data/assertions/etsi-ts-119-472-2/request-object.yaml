- id: etsi-472-2/OIDFVP-HAIP-API-03
  subject: vp.dc-api.unsigned
  spec: etsi-ts-119-472-2
  locator: { req: OIDFVP-HAIP-API-03, section: "6.5.1" }
  relation: profiles
  level: shall-not
  applies_to: { role: [ wallet ] }
  quote: "OIDFVP-HAIP-API-03: The EUDI Wallet shall not support Authorization Requests with exchange protocol value set to
    \"openid4vp-1-unsigned\"."
  verified: needs-review
  review:
    reason: >-
      ETSI names the unsigned protocol "openid4vp-1-unsigned"; OpenID4VP 1.0 Final (Appendix A.1) defines it as
      "openid4vp-v1-unsigned". Read as: the wallet does not accept unsigned DC API requests.
