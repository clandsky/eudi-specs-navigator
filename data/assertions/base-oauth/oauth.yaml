  subject: vci.dpop-proof.typ
  spec: rfc-9449
  locator: { section: "4.2" }
  relation: defines
  level: shall
  applies_to: { role: [ wallet ] }
  quote: "typ: A field with the value dpop+jwt, which explicitly types the"
  verified: source-checked
- id: rfc9449/5/token_type
  subject: vci.token-response.token_type
  spec: rfc-9449
  locator: { section: "5" }
  relation: defines
  level: shall
  applies_to: { role: [ as ] }
  quote: "A token_type of DPoP MUST be"
  verified: source-checked
- id: rfc9449/7.1/scheme
  subject: vci.credential-request.authorization
  spec: rfc-9449
  locator: { section: "7.1" }
  relation: defines
  level: shall
  applies_to: { role: [ wallet ] }
  quote: "A DPoP-bound access token is sent using the Authorization request header field per Section 11.6.2 of [RFC9110]
    with an authentication scheme of DPoP."
  verified: source-checked
