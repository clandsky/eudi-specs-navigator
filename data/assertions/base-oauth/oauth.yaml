- id: rfc9449/4/dpop
  subject: vci.dpop-proof
  spec: rfc-9449
  locator: { section: "4" }
  relation: defines
  level: info
  quote: "DPoP introduces the concept of a DPoP proof, which is a JWT created by the client and sent with an HTTP request
    using the DPoP header field. Each HTTP request requires a unique DPoP proof."
  verified: source-checked
